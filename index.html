    ret\n.section __TEXT,__cstring\n_message:\n    .asciz \"hello\"", "concepts": [{"token": "adrp", "name": "Page-relative addressing", "desc": "Forms a page-relative address; ADR forms a nearby PC-relative address. Relocations let the linker fix symbol references."}, {"token": "_message@PAGE", "name": "Relocation expressions", "desc": "Apple assembler syntax references the page containing a symbol; the exact syntax differs across object formats."}, {"token": "_message@PAGEOFF", "name": "Page offset", "desc": "Adds the symbol's offset within its page to form its address."}, {"token": ".section __TEXT,__cstring", "name": "Sections and data", "desc": "Mach-O sections categorize code, strings and data; .asciz emits a NUL-terminated string."}, {"token": ".asciz", "name": "Instruction versus data", "desc": "Assembly directives emit data or control assembler behavior, rather than CPU instructions. Inline asm in C uses operand constraints and clobbers to inform the compiler."}]}, {"id": "t4-7", "title": "CPU privilege, memory ordering and protection", "desc": "Understand architecture terminology used in kernel research.", "code": "    dmb ish\n    dsb ish\n    isb\n    ret", "concepts": [{"token": "dmb ish", "name": "Memory ordering", "desc": "A data memory barrier orders relevant memory accesses in the specified domain. Correct synchronization requires a higher-level memory model, not arbitrary barriers."}, {"token": "dsb ish", "name": "Completion barrier", "desc": "A data synchronization barrier waits for specified operations to complete; stronger than mere ordering for relevant accesses."}, {"token": "isb", "name": "Instruction synchronization", "desc": "Ensures subsequent instructions are fetched/executed with the relevant updated context after certain architectural changes."}, {"token": "ret", "name": "Privilege and exception levels", "desc": "EL0 is typical user space; EL1 typical kernel, EL2 hypervisor, EL3 secure monitor where implemented. Exceptions, interrupts and SVC transfer control through defined vectors and OS policy."}, {"token": "", "name": "MMU, page tables and caches", "desc": "MMU translates virtual addresses through page tables; TLB caches translations. CPU caches store data/instructions. Page permissions, faults and context switches are essential OS concepts."}, {"token": "", "name": "System registers and atomics", "desc": "MRS/MSR access system registers where permitted; exclusive loads/stores and atomic instruction families support synchronization. Access depends on privilege and architecture."}, {"token": "", "name": "Pointer authentication", "desc": "PAC/AUT instruction families sign and authenticate certain pointer representations on supported hardware. They help protect pointer integrity but are not a complete memory-safety guarantee."}]}]}, {"id": "t5", "name": "Swift", "short": "Swift", "desc": "Modern iOS and native interoperability", "color": "#ffb07a", "lessons": [{"id": "t5-1", "title": "Variables, types and collections", "desc": "Learn Swift value syntax and safe basic expressions.", "code": "let name: String = \"sample\"\nvar count = 3\nlet wide: UInt64 = 42\nlet ready: Bool = true\nlet ratio: Double = 0.5\nvar items = [1, 2, 3]\nitems.append(count)\nlet map: [String: Int] = [\"count\": count]\nlet unique: Set<Int> = [1, 2, 2]", "concepts": [{"token": "let name: String", "name": "Constants and explicit types", "desc": "let prevents reassignment; String is a Unicode-aware value type. Explicit annotation specifies the expected type."}, {"token": "var count", "name": "Variables and inference", "desc": "var permits reassignment; the compiler infers Int from this initializer. Int width depends on platform."}, {"token": "UInt64", "name": "Fixed-width integers", "desc": "UInt64 represents unsigned 64-bit values; normal arithmetic traps on overflow unless explicitly using wrapping operations."}, {"token": "Bool", "name": "Booleans and floating point", "desc": "Swift conditions require Bool rather than implicit integer truth. Double represents approximate floating-point values."}, {"token": "[1, 2, 3]", "name": "Arrays", "desc": "Array is a value-semantic collection; it uses copy-on-write optimization. Bounds are checked at runtime."}, {"token": "items.append(count)", "name": "Mutation", "desc": "Adds an element to a mutable array. A let-bound value-type collection cannot be mutated this way."}, {"token": "[String: Int]", "name": "Dictionaries", "desc": "Associates hashable keys with values; subscripting by key returns an optional because the key may not exist."}, {"token": "Set<Int>", "name": "Sets", "desc": "Stores unique hashable values without guaranteed order."}]}, {"id": "t5-2", "title": "Conditions, loops and optionals", "desc": "Read safe absence handling and branching.", "code": "func classify(_ input: String?) -> String {\n    guard let text = input else { return \"missing\" }\n    if let number = Int(text), number > 0 {\n        for i in 0..<number { if i > 3 { break } }\n        return \"positive\"\n    }\n    switch text {\n    case \"0\": return \"zero\"\n    default: return \"other\"\n    }\n}\nlet length = Optional(\"hello\")?.count ?? 0", "concepts": [{"token": "String?", "name": "Optional types", "desc": "Represents either a String or nil. Force unwrapping with ! can trap if the value is absent; prefer safe unwrapping."}, {"token": "guard let", "name": "Guard binding", "desc": "Unwraps the optional and makes text available afterward; the else branch must exit the enclosing scope."}, {"token": "if let number", "name": "Conditional binding", "desc": "Unwraps a failable conversion only inside the successful branch; comma-separated conditions are evaluated in order."}, {"token": "for i in 0..<number", "name": "For-in loops and ranges", "desc": "Iterates a half-open range excluding the upper bound. while checks before each iteration; repeat-while runs once first."}, {"token": "break", "name": "Loop control", "desc": "Exits the nearest loop; continue skips an iteration and return exits the function."}, {"token": "switch text", "name": "Switch and pattern matching", "desc": "Selects a matching case and must be exhaustive; no implicit fallthrough. Enums and patterns can bind associated values."}, {"token": "?.count", "name": "Optional chaining", "desc": "Calls a property only if the optional contains a value; the result remains optional."}, {"token": "?? 0", "name": "Nil coalescing", "desc": "Uses a fallback when the left optional is nil."}]}, {"id": "t5-3", "title": "Functions, closures and generics", "desc": "Learn argument labels, capture and reusable abstractions.", "code": "func add(_ a: Int, to b: Int = 1) -> Int { a + b }\nfunc first<T>(_ values: [T]) -> T? { values.first }\nfunc transform(_ value: Int, using fn: (Int) -> Int) -> Int {\n    fn(value)\n}\nlet offset = 5\nlet result = transform(10) { n in n + offset }\nlet mapped = [1,2,3].map { $0 * 2 }", "concepts": [{"token": "func add", "name": "Function declarations", "desc": "func introduces a function; -> specifies return type. Single-expression functions can use implicit return."}, {"token": "_ a: Int", "name": "Argument labels", "desc": "_ suppresses the external label, while to b supplies external and internal names; defaults can be omitted by callers."}, {"token": "<T>", "name": "Generics", "desc": "T is a type parameter; constraints can require protocol conformance. The function works for arrays of any suitable element type."}, {"token": "(Int) -> Int", "name": "Function types", "desc": "Specifies a callable taking Int and returning Int; functions and closures can be passed as values."}, {"token": "{ n in n + offset }", "name": "Closures and captures", "desc": "Anonymous callable captures offset from surrounding scope; trailing closure syntax places the last closure outside parentheses."}, {"token": "$0", "name": "Shorthand closure parameters", "desc": "References the first inferred closure argument; map transforms each element into a new collection."}]}, {"id": "t5-4", "title": "Types, protocols and extensions", "desc": "Understand Swift object and value semantics.", "code": "protocol Describable { var text: String { get } }\nstruct Record: Describable {\n    var id: Int\n    var text: String { \"Record \\(id)\" }\n}\nenum Status { case idle, ready(Int) }\nclass Owner {\n    var record: Record { didSet { print(record.id) } }\n    init(record: Record) { self.record = record }\n    deinit { }\n}\nextension Record { func doubled() -> Int { id * 2 } }", "concepts": [{"token": "protocol Describable", "name": "Protocols", "desc": "Defines requirements that conforming types implement; supports abstraction independent of inheritance."}, {"token": "struct Record", "name": "Structures and value semantics", "desc": "Structures are value types; assignment produces independent logical values. Conformance follows the colon."}, {"token": "var text: String { ", "name": "Computed properties", "desc": "Calculate a value when accessed rather than storing it. Properties can also have setters."}, {"token": "case idle, ready(Int)", "name": "Enumerations and associated values", "desc": "Each case can carry different typed data; pattern matching can extract associated values."}, {"token": "class Owner", "name": "Classes and reference semantics", "desc": "Class instances are reference types and can inherit from a superclass; ARC manages lifetime."}, {"token": "didSet", "name": "Property observers", "desc": "Runs after a property changes; willSet runs before assignment. Initialization has special observer rules."}, {"token": "init(record: Record)", "name": "Initializers", "desc": "Establish valid stored properties before use; self refers to the instance. Access modifiers include private, fileprivate, internal and public."}, {"token": "deinit", "name": "Deinitializers", "desc": "Run before class instances are deallocated; structs do not have ordinary class-style deinit."}, {"token": "extension Record", "name": "Extensions", "desc": "Add methods, computed properties or protocol conformances to existing types; generally cannot add stored instance properties."}]}, {"id": "t5-5", "title": "Errors, ARC and asynchronous work", "desc": "Handle failures and lifetime across asynchronous calls.", "code": "enum DemoError: Error { case invalid }\nfunc load(_ n: Int) throws -> Int {\n    guard n >= 0 else { throw DemoError.invalid }\n    return n\n}\nfunc fetch() async throws -> Int { try load(42) }\nTask {\n    do { let result = try await fetch(); print(result) }\n    catch { print(error) }\n}\nclass Owner { weak var peer: Owner? }", "concepts": [{"token": "throws", "name": "Throwing functions", "desc": "Declares that a function can propagate an Error; callers use try or a handling form."}, {"token": "throw DemoError.invalid", "name": "Error values", "desc": "Throws a typed value conforming to Error. Avoid using force-try when failure is possible."}, {"token": "async throws", "name": "Asynchronous functions", "desc": "async functions may suspend rather than blocking a thread. throws remains an independent failure contract."}, {"token": "Task", "name": "Unstructured task", "desc": "Starts asynchronous work in a task; cancellation is cooperative and lifetime should be deliberately managed."}, {"token": "try await", "name": "Suspension and failure", "desc": "await marks a possible suspension; try propagates an error. Actors and isolation protect state under concurrency rules."}, {"token": "catch", "name": "Error handling", "desc": "do-catch handles thrown errors; defer runs cleanup on scope exit, including thrown paths."}, {"token": "weak var peer", "name": "ARC and ownership", "desc": "Weak references do not extend lifetime and become nil when the object dies. unowned assumes the object is alive and can trap if it is not; cycles need deliberate ownership."}]}, {"id": "t5-6", "title": "Unsafe pointers and C interoperability", "desc": "Use scoped buffer access and understand native bridging.", "code": "import Foundation\nvar values: [UInt8] = [1,2,3]\nlet sum = values.withUnsafeBytes { raw -> Int in\n    raw.reduce(0) { $0 + Int($1) }\n}\nvalues.withUnsafeMutableBufferPointer { buffer in\n    if let base = buffer.baseAddress { base.pointee = 9 }\n}\nlet text = \"hello\"\ntext.withCString { ptr in print(String(cString: ptr)) }", "concepts": [{"token": "import Foundation", "name": "Modules and bridging", "desc": "Imports a module. C/Objective-C declarations can be exposed through imported modules or a bridging header in an Xcode app."}, {"token": "withUnsafeBytes", "name": "Raw buffers", "desc": "Supplies an UnsafeRawBufferPointer for the duration of the closure; do not escape its pointer beyond that lifetime."}, {"token": "raw.reduce", "name": "Collection algorithms", "desc": "Accumulates a result; here each byte is converted to Int before addition. Generic algorithms operate on sequences."}, {"token": "withUnsafeMutableBufferPointer", "name": "Typed mutable buffers", "desc": "Provides a scoped buffer view into mutable array storage; mutation may invalidate other views and must respect exclusivity."}, {"token": "buffer.baseAddress", "name": "Unsafe pointers and nullability", "desc": "Returns an optional typed pointer; empty buffers may not have a usable first element. UnsafePointer and UnsafeMutablePointer carry no general lifetime guarantee."}, {"token": "base.pointee", "name": "Dereferencing", "desc": "Reads or writes the pointed-to element; valid alignment, initialization and bounds are the programmer's responsibility."}, {"token": "withCString", "name": "C string interoperability", "desc": "Provides a temporary NUL-terminated UTF-8 pointer valid during the closure. Swift String and C buffers have different representations."}]}, {"id": "t5-7", "title": "UIKit and SwiftUI overview", "desc": "Learn app-layer concepts used by native tooling.", "code": "import SwiftUI\nstruct DemoView: View {\n    @State private var count = 0\n    var body: some View {\n        VStack {\n            Text(\"Count: \\(count)\")\n            Button(\"Add\") { count += 1 }\n        }\n    }\n}", "concepts": [{"token": "struct DemoView: View", "name": "Declarative view types", "desc": "A SwiftUI view describes UI for current state; UIKit instead uses imperative view/controller objects and delegates."}, {"token": "@State", "name": "Property wrappers", "desc": "State provides SwiftUI-managed local storage and triggers UI updates when changed."}, {"token": "private var count", "name": "Access control and state", "desc": "private limits access; state should have a clear owner and mutation path."}, {"token": "some View", "name": "Opaque result types", "desc": "Exposes a protocol-conforming result without revealing the concrete type, while preserving one underlying type per declaration."}, {"token": "VStack", "name": "View composition", "desc": "A result-builder closure combines child views into a vertical stack; layout is derived from the view tree."}, {"token": "Button(\"Add\")", "name": "Event handling", "desc": "A closure responds to a user action and updates state, causing the dependent view to refresh."}]}]}, {"id": "t6", "name": "Shell Scripting", "short": "SH", "desc": "Offline build and automation fundamentals", "color": "#e5d487", "lessons": [{"id": "t6-1", "title": "Variables, quoting and arguments", "desc": "Read portable shell syntax and substitution.", "code": "#!/bin/sh\nname=\"sample project\"\nexport BUILD_MODE=debug\nprintf '%s\\n' \"$name\"\nfile=\"${1:-README.md}\"\nprintf '%s\\n' \"$file\"\nfor arg in \"$@\"; do printf '%s\\n' \"$arg\"; done", "concepts": [{"token": "#!/bin/sh", "name": "Shebang", "desc": "Specifies an interpreter when a script is executed directly on supporting systems. Syntax differs across sh, Bash and zsh."}, {"token": "name=\"sample project\"", "name": "Variable assignment", "desc": "No spaces around = in shell assignment. Quoting preserves embedded spaces."}, {"token": "export BUILD_MODE=debug", "name": "Environment variables", "desc": "Exports a variable to child processes; shell-local variables are otherwise not automatically inherited."}, {"token": "\"$name\"", "name": "Quoting and expansion", "desc": "Double quotes allow parameter expansion without ordinary splitting/globbing; single quotes preserve literal text."}, {"token": "${1:-README.md}", "name": "Positional parameters and defaults", "desc": "$1 is the first argument; :- substitutes a fallback if absent or empty. $# counts arguments; $0 is the script name."}, {"token": "\"$@\"", "name": "Argument preservation", "desc": "Expands positional arguments as separate words when quoted; unlike unquoted expansions, it preserves spaces and empty arguments."}, {"token": "printf '%s\\n'", "name": "Safe formatted output", "desc": "Use a constant format string and pass data as arguments. printf is more portable than relying on echo escape behavior."}]}, {"id": "t6-2", "title": "Conditionals, loops and functions", "desc": "Understand script flow and exit status.", "code": "#!/bin/sh\nshow() {\n    if [ -f \"$1\" ]; then\n        printf 'file: %s\\n' \"$1\"\n    elif [ -d \"$1\" ]; then\n        printf 'directory\\n'\n    else\n        return 1\n    fi\n}\ncase \"${1:-}\" in\n    *.txt) show \"$1\" ;;\n    *) printf 'choose a text file\\n' ;;\nesac\nfor i in 1 2 3; do printf '%s\\n' \"$i\"; done", "concepts": [{"token": "show()", "name": "Shell functions", "desc": "Defines a callable command with its own positional arguments. return sets status, not an arbitrary data return value."}, {"token": "[ -f \"$1\" ]", "name": "Tests and conditions", "desc": "[ is a command testing conditions; -f checks regular file, -d directory. Spaces and quoting are significant."}, {"token": "elif", "name": "If/elif/else", "desc": "Shell if branches on command exit status: zero is success/true, nonzero false/failure."}, {"token": "return 1", "name": "Exit status", "desc": "A nonzero status conventionally signals failure; $? stores the immediately preceding command's status."}, {"token": "case", "name": "Pattern selection", "desc": "Matches a word against glob patterns; ;; terminates a clause. * matches arbitrary characters."}, {"token": "for i in 1 2 3", "name": "Loops", "desc": "Iterates words. while repeats while a command succeeds; until repeats while it fails. break/continue control loops."}]}, {"id": "t6-3", "title": "Pipes, redirections and substitutions", "desc": "Explore command composition in a harmless example.", "code": "#!/bin/sh\nprintf '%s\\n' beta alpha beta | sort | uniq\ncount=$(printf '%s\\n' alpha beta | wc -l)\nnext=$((count + 1))\nprintf '%s\\n' \"$next\" > report.txt\nprintf '%s\\n' done >> report.txt\ncat report.txt 2> errors.txt\n[ -s report.txt ] && printf 'ok\\n' || printf 'empty\\n'", "concepts": [{"token": "| sort ", "name": "Pipelines", "desc": "Connect stdout of one command to stdin of another; default pipeline status is often the last command. Bash pipefail is not portable sh."}, {"token": "$(printf '%s\\n' alpha beta | wc -l)", "name": "Command substitution", "desc": "Captures command stdout, stripping trailing newlines. Quote substitution when used as data."}, {"token": "$((count + 1))", "name": "Arithmetic expansion", "desc": "Evaluates an integer arithmetic expression and substitutes the result."}, {"token": "> report.txt", "name": "Output redirection", "desc": "Opens or truncates a file and sends stdout there. < redirects input; ensure paths are correct before redirecting."}, {"token": ">> report.txt", "name": "Append redirection", "desc": "Appends instead of truncating; permissions and concurrent writes still matter."}, {"token": "2> errors.txt", "name": "Standard error", "desc": "Redirects file descriptor 2. 2>&1 duplicates stdout's current destination; order matters."}, {"token": "&&", "name": "Logical chaining", "desc": "Runs the next command only if the previous succeeds; || runs on failure. A chain is not always identical to an if/else block."}]}, {"id": "t6-4", "title": "File operations, text processing and cleanup", "desc": "Understand safe build automation and error handling.", "code": "#!/bin/sh\nset -eu\nwork=$(mktemp -d)\ntrap 'rm -rf -- \"$work\"' EXIT\nmkdir -p \"$work/output\"\nprintf '%s\\n' 'mode=debug' > \"$work/config.txt\"\ngrep '^mode=' \"$work/config.txt\" | sed 's/^mode=//'\ncp \"$work/config.txt\" \"$work/output/config.txt\"\nfind \"$work/output\" -type f -print", "concepts": [{"token": "set -eu", "name": "Error and unset-variable modes", "desc": "set -e exits on many unhandled failures but has exceptions in conditionals and pipelines; -u errors on many unset expansions. Explicit checks remain valuable."}, {"token": "mktemp -d", "name": "Temporary directories", "desc": "Creates a unique temporary directory; check failure and keep its path quoted. This avoids predictable-name collisions."}, {"token": "trap", "name": "Cleanup traps", "desc": "Runs cleanup on shell exit. This example removes only its own generated directory; never substitute an unchecked arbitrary path into recursive deletion."}, {"token": "mkdir -p", "name": "Directory operations", "desc": "Creates directories and missing parents. cp copies files; mv renames or moves them. Globs expand path patterns, so quote literal paths."}, {"token": "grep", "name": "Text search", "desc": "Selects lines matching a pattern; ^ anchors start of line. sed transforms text and awk processes fields/records."}, {"token": "find", "name": "File traversal", "desc": "Walks a directory tree and applies predicates such as -type f. Prefer argument-safe handling of filenames; archives use tar or zip."}]}]}, {"id": "t7", "name": "Makefile", "short": "MAKE", "desc": "Build graphs, compiler and linker orchestration", "color": "#b4df90", "lessons": [{"id": "t7-1", "title": "Targets, prerequisites and recipes", "desc": "Learn declarative dependency-driven builds.", "code": ".PHONY: all clean\nall: app\napp: main.o util.o\n\t$(CC) main.o util.o -o app\nmain.o: main.c util.h\n\t$(CC) -c main.c -o main.o\nutil.o: util.c util.h\n\t$(CC) -c util.c -o util.o\nclean:\n\t$(RM) app main.o util.o", "concepts": [{"token": ".PHONY", "name": "Phony targets", "desc": "Names actions that do not represent files; prevents a same-named file from suppressing the action."}, {"token": "all: app", "name": "Default goal and dependencies", "desc": "The first ordinary target is generally the default goal. all depends on app, so Make ensures app is up-to-date first."}, {"token": "app: main.o util.o", "name": "Prerequisites", "desc": "If prerequisites are newer or target is missing, Make considers rebuilding. This forms a dependency graph."}, {"token": "$(CC) main.o util.o -o app", "name": "Recipes and linking", "desc": "A recipe is a shell command, normally introduced by a tab. This command links two object files into an executable."}, {"token": "main.o: main.c util.h", "name": "Header dependencies", "desc": "Changes to util.h trigger recompilation; real builds can generate dependency files automatically."}, {"token": "$(CC) -c main.c", "name": "Compilation", "desc": "The -c flag compiles and assembles without linking. Object files contain machine code and relocations."}, {"token": "clean:", "name": "Cleanup targets", "desc": "Removes known build outputs rather than source files. Make does not automatically know which files are generated."}]}, {"id": "t7-2", "title": "Variables, pattern rules and automatic variables", "desc": "Understand reusable build expressions.", "code": "CC ?= clang\nCFLAGS := -Wall -Wextra -g\nCFLAGS += -O2\nSOURCES := $(wildcard src/*.c)\nOBJECTS := $(SOURCES:.c=.o)\napp: $(OBJECTS)\n\t$(CC) $(LDFLAGS) $^ -o $@ $(LDLIBS)\n%.o: %.c\n\t$(CC) $(CPPFLAGS) $(CFLAGS) -c $< -o $@", "concepts": [{"token": "CC ?= clang", "name": "Conditional assignment", "desc": "Sets a variable only if undefined; Make's built-in CC may already be defined. = creates recursively expanded variables."}, {"token": "CFLAGS :=", "name": "Immediate expansion", "desc": "Evaluates the right side when assigned. = instead expands when used; += appends according to variable flavor."}, {"token": "$(wildcard src/*.c)", "name": "Make functions and globbing", "desc": "Expands matching filenames during Make evaluation; $(shell ...) can capture shell output during expansion."}, {"token": "$(SOURCES:.c=.o)", "name": "Substitution references", "desc": "Transforms suffixes in a word list, mapping source paths to object paths."}, {"token": "$^", "name": "Automatic prerequisites", "desc": "Expands to all normal prerequisites with duplicate names removed. $+ preserves duplicates; order can matter when linking."}, {"token": "$@", "name": "Automatic target", "desc": "Expands to the target currently being built. Use it to avoid repeating filenames."}, {"token": "%.o: %.c", "name": "Pattern rule", "desc": "Defines a recipe for any matching object/source stem. Make selects applicable implicit rules."}, {"token": "$<", "name": "First prerequisite", "desc": "Expands to the first prerequisite, commonly the source file in a pattern rule."}]}, {"id": "t7-3", "title": "Compiler flags, linkage and build conditions", "desc": "Read platform builds and native artifacts.", "code": "ARCH ?= arm64\nMODE ?= debug\nCPPFLAGS += -Iinclude -DAPP_VERSION=1\nCFLAGS += -Wall\nifeq ($(MODE),debug)\nCFLAGS += -O0 -g\nelse\nCFLAGS += -O2\nendif\nLDFLAGS += -Llib\nLDLIBS += -lsample\napp: main.o\n\t$(CC) -arch $(ARCH) $(LDFLAGS) $^ $(LDLIBS) -o $@", "concepts": [{"token": "ARCH ?= arm64", "name": "Architecture selection", "desc": "Sets a build parameter; Apple's Clang supports -arch for target architectures. Cross-compiling also requires appropriate target SDK and toolchain."}, {"token": "-Iinclude", "name": "Header search paths", "desc": "Adds a preprocessor include directory. -D defines a preprocessing macro, often used for build configuration."}, {"token": "ifeq ($(MODE),debug)", "name": "Make conditionals", "desc": "Evaluates during Make parsing, unlike a shell if in a recipe; ifneq is the opposite equality test."}, {"token": "-O0 -g", "name": "Optimization and debugging", "desc": "O0 limits optimization and -g emits debug information; O2 enables optimization that can alter generated code and debugging behavior."}, {"token": "-Llib", "name": "Library search paths", "desc": "Adds a linker search directory; -l names a library, not necessarily its full filename."}, {"token": "-lsample", "name": "Static and dynamic linking", "desc": "Static archives contribute object code; dynamic libraries remain runtime dependencies. Symbol visibility, relocations and order can affect linking."}, {"token": "-arch $(ARCH)", "name": "Compilation pipeline and ABI", "desc": "Preprocess, compile, assemble and link; Mach-O is the Apple native format. Xcode targets and SDK choices also influence ABI, signing and packaging."}]}, {"id": "t7-4", "title": "Build orchestration and metadata", "desc": "Understand multi-component builds and configuration without external services.", "code": ".PHONY: all library app check\nall: app\nlibrary:\n\t$(MAKE) -C lib\napp: library\n\t$(MAKE) -C app\ncheck: app\n\t@printf '%s\\n' 'build ready'", "concepts": [{"token": "$(MAKE) -C lib", "name": "Recursive Make", "desc": "Uses Make's recursive invocation variable and changes directory. Jobserver and flags can propagate to child builds."}, {"token": "app: library", "name": "Component ordering", "desc": "Expresses dependency so library builds first; independent targets may run in parallel with -j."}, {"token": "@printf", "name": "Recipe prefixes", "desc": "@ suppresses command echo; - ignores command failure and + requests execution in certain recursive/dry-run contexts. Use intentionally."}, {"token": "check: app", "name": "Validation targets", "desc": "A check target can depend on built artifacts and run tests. Explicit dependencies make failures and rebuilds traceable."}, {"token": "", "name": "CI and configuration literacy", "desc": "YAML workflows describe jobs, runners, steps and environment; XML property lists store typed dictionaries and arrays. Xcode project settings, entitlements and package control files are metadata, not executable C source."}]}]}]</script><script>
'use strict';
const TRACKS=JSON.parse(document.getElementById('curriculum').textContent), LESSONS=TRACKS.flatMap(t=>t.lessons.map(l=>({...l,track:t.id}))), BY_ID=Object.assign(Object.create(null),Object.fromEntries(LESSONS.map(l=>[l.id,l]))), TOTAL_CONCEPTS=LESSONS.reduce((n,l)=>n+l.concepts.length,0), KEY='kernel-quest.progress.v1';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), pct=(a,b)=>b?Math.round(100*a/b):0, empty=()=>({version:1,learned:{},completed:{},quiz:{},last:null,days:[]});let storageOK=true, state=empty(), selected=0, filter='all', quizSession={}, toastTimer, currentRoute='';
function sanitize(raw){let s=empty();if(!raw||raw.version!==1)throw Error('Unsupported progress version.');for(const l of LESSONS){if(raw.learned?.[l.id]&&Array.isArray(raw.learned[l.id]))s.learned[l.id]=[...new Set(raw.learned[l.id].filter(i=>Number.isInteger(i)&&i>=0&&i<l.concepts.length))];if(raw.completed?.[l.id]===true){s.completed[l.id]=true;s.learned[l.id]=l.concepts.map((_,i)=>i)}let q=raw.quiz?.[l.id];if(Number.isInteger(q)&&q>=0&&q<=3)s.quiz[l.id]=q}if(BY_ID[raw.last])s.last=raw.last;if(Array.isArray(raw.days))s.days=[...new Set(raw.days.filter(x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)))].sort();return s}
try{let raw=localStorage.getItem(KEY);if(raw)state=sanitize(JSON.parse(raw));localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}
function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function persist(activity=false){if(activity&&!state.days.includes(today()))state.days.push(today());try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;toast('Browser storage is unavailable. Export progress before closing.')}updateChrome()}
function stats(){let c=Object.keys(state.completed).length,k=LESSONS.reduce((s,l)=>s+(state.learned[l.id]?.length||0),0),q=Object.values(state.quiz).filter(x=>x===3).length,xp=k*5+c*25+q*30;return {c,k,q,xp,level:1+Math.floor(xp/150),mastered:TRACKS.filter(t=>t.lessons.every(l=>state.completed[l.id])).length}}
function trackStats(t){let c=t.lessons.filter(l=>state.completed[l.id]).length,k=t.lessons.reduce((a,l)=>a+(state.learned[l.id]?.length||0),0),n=t.lessons.reduce((a,l)=>a+l.concepts.length,0);return{c,k,n,p:pct(k,n)}}
function streak(){let d=new Date(),n=0;const has=d=>state.days.includes([d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'));if(!has(d))d.setDate(d.getDate()-1);while(has(d)){n++;d.setDate(d.getDate()-1)}return n}
function rank(level){return level>=30?'Kernel Architect':level>=20?'Systems Vanguard':level>=12?'Native Engineer':level>=7?'Memory Adept':level>=3?'Code Scout':'Apprentice'}
function toast(msg){let el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3200)}
function bar(p){return `<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100" aria-label="Progress"><span style="width:${p}%"></span></div>`}
function go(route){if(location.hash.slice(1)===route){render()}else location.hash=route;closeMenu()}
function closeMenu(){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open');$('#menu').setAttribute('aria-expanded','false')}
function updateChrome(){let s=stats(),r=location.hash.slice(1)||'home';$('#levelpill').textContent=`LV ${String(s.level).padStart(2,'0')} · ${s.xp} XP`;let tnav=TRACKS.map(t=>`<button class="navbtn ${r===t.id||r.startsWith(t.id+'-')?'active':''}" data-go="${t.id}" style="--track:${t.color}"><span class="navicon">${esc(t.short)}</span><span class="navname">${esc(t.name)}</span><span class="navpct">${trackStats(t).p}%</span></button>`).join('');$('#sidebar').innerHTML=`<div class="brand"><div class="brand-mark"><img src="assets/logo-mark.png" width="40" height="40" alt="Kernel Quest"></div><div><strong>Kernel Quest</strong><small>OFFLINE ACADEMY</small></div></div><div class="navlabel">COMMAND CENTER</div><button class="navbtn ${r==='home'?'active':''}" data-go="home"><span class="navicon">⌂</span><span class="navname">Dashboard</span></button><button class="navbtn ${r==='progress'?'active':''}" data-go="progress"><span class="navicon">XP</span><span class="navname">Progress & backup</span></button><div class="navlabel">LANGUAGE TRACKS</div>${tnav}<div class="sidebar-foot"><span class="dot"></span>${storageOK?'Local progress active':'Storage unavailable'}<br>Offline · No account · No network<br>Curriculum v1.0</div>`}
function achievements(){let s=stats();return [['✦','First quest','Complete 1 lesson',s.c>=1],['◈','Code cartographer','Learn 50 concepts',s.k>=50],['◆','Perfect recall','Pass 5 quizzes',s.q>=5],['▣','Track cleared','Complete a language',s.mastered>=1],['↟','Steady study','3-day study streak',streak()>=3],['★','Systems scholar','Complete all lessons',s.c===LESSONS.length]].map(([icon,title,desc,ok])=>`<div class="achievement ${ok?'':'locked'}"><div class="medal">${icon}</div><div><strong>${title}</strong><small>${desc} · ${ok?'Unlocked':'Locked'}</small></div></div>`).join('')}
function home(){let s=stats(),next=BY_ID[state.last]&&!state.completed[state.last]?state.last:LESSONS.find(l=>!state.completed[l.id])?.id||LESSONS[0].id;return `<section class="hero"><div><div class="eyebrow">SYSTEMS ENGINEERING // LEARNING CAMPAIGN</div><h1>From source code<br>to the silicon.</h1><p>Eight language tracks. Explore code line by line, learn the underlying concepts, and build your systems-programming foundation at your own pace.</p><button class="primary" data-go="${next}">${s.k?'Continue learning':'Start your first quest'} →</button></div><div class="hero-right"><div class="eyebrow">PLAYER PROFILE</div><div class="rank">${rank(s.level)}</div><small>Level ${s.level} · ${s.xp} total XP</small><div class="xp-line"><span>Next level</span><span>${s.xp%150} / 150 XP</span></div>${bar(pct(s.xp%150,150))}<div class="fineprint">+5 XP per concept · +25 per completed lesson · +30 per perfect quiz</div></div></section><div class="statgrid"><div class="stat"><strong>${pct(s.k,TOTAL_CONCEPTS)}%</strong><small>Concept progress</small></div><div class="stat"><strong>${s.c}/${LESSONS.length}</strong><small>Quests cleared</small></div><div class="stat"><strong>${s.q}</strong><small>Perfect quizzes</small></div><div class="stat"><strong>${streak()} days</strong><small>Study streak</small></div></div><div class="sectionhead"><h2>Choose your language</h2><small>${TRACKS.length} tracks · ${TOTAL_CONCEPTS} concept modules</small></div><div class="trackgrid">${TRACKS.map(t=>{let a=trackStats(t);return `<button class="trackcard" style="--track:${t.color}" data-go="${t.id}"><div class="tracktop"><span class="navicon">${esc(t.short)}</span><div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p></div></div><div class="trackmeta"><span>${a.c}/${t.lessons.length} lessons</span><span>${a.p}%</span></div>${bar(a.p)}<p style="margin-top:8px">${a.k}/${a.n} concepts learned</p></button>`}).join('')}</div><div class="sectionhead"><h2>Achievements</h2><small>Unlock by studying</small></div><div class="achievementgrid">${achievements()}</div><p class="fineprint">Original teaching examples inspired by the language and systems topics relevant to Dopamine/RootHide and XNU. Not a source-verified exhaustive repository inventory. Lessons are self-attested; quizzes measure recognition, not practical mastery.</p>`}
function lessonRow(l,i,showTrack=false){let t=TRACKS.find(t=>t.id===l.track)||TRACKS.find(t=>t.lessons.includes(l)),k=state.learned[l.id]?.length||0;return `<button class="lessonrow" data-go="${l.id}"><span class="lessonnum ${state.completed[l.id]?'done':''}">${state.completed[l.id]?'✓':String(i+1).padStart(2,'0')}</span><span class="lessoninfo"><strong>${showTrack?esc(t.name)+' · ':''}${esc(l.title)}</strong><small>${esc(l.desc)}</small></span><span class="lessonmeta">${k}/${l.concepts.length} · ${state.quiz[l.id]===3?'Quiz ✓':'30 quiz XP'}</span><span aria-hidden="true">›</span></button>`}
function trackView(t){let a=trackStats(t),ls=t.lessons.filter(l=>filter==='all'||(filter==='done'?state.completed[l.id]:!state.completed[l.id]));return `<div class="breadcrumbs"><button class="crumb" data-go="home">Dashboard</button> / ${esc(t.name)}</div><div class="trackhero" style="--track:${t.color}"><span class="navicon">${esc(t.short)}</span><div><div class="eyebrow">LANGUAGE TRACK ${TRACKS.indexOf(t)+1}/8</div><h1>${esc(t.name)}</h1><p>${esc(t.desc)}</p></div></div><div class="panel" style="--track:${t.color}"><div class="trackmeta"><span>${a.k}/${a.n} concepts · ${a.c}/${t.lessons.length} lessons cleared</span><span>${a.p}%</span></div>${bar(a.p)}<div class="toolbar"><button class="primary" data-go="${t.lessons.find(l=>!state.completed[l.id])?.id||t.lessons[0].id}">${a.c===t.lessons.length?'Review track':'Continue track'} →</button></div></div><div class="sectionhead"><h2>Quest log</h2><label class="muted" style="font-size:12px">Filter <select id="filter" style="background:#151d2d;color:inherit;border:1px solid #273249;border-radius:6px;padding:5px"><option value="all" ${filter==='all'?'selected':''}>All lessons</option><option value="todo" ${filter==='todo'?'selected':''}>Incomplete</option><option value="done" ${filter==='done'?'selected':''}>Completed</option></select></label></div><div class="lessonlist">${ls.length?ls.map(l=>lessonRow(l,t.lessons.indexOf(l))).join(''):'<div class="empty">No lessons match this filter.</div>'}</div>`}
function codeHTML(l){let tokens=l.concepts.map((c,i)=>({...c,i})).filter(c=>c.token);return l.code.split('\n').map((line,n)=>{let parts=[],p=0;while(p<line.length){let matches=tokens.filter(c=>line.startsWith(c.token,p)).sort((a,b)=>(b.i===selected)-(a.i===selected)||b.token.length-a.token.length);if(matches.length){let m=matches[0];parts.push(`<button class="codehit ${m.i===selected?'sel':''}" data-concept="${m.i}" aria-label="Explain ${esc(m.name)}" title="${esc(m.name)}">${esc(m.token)}</button>`);p+=m.token.length}else{let start=p++;while(p<line.length&&!tokens.some(c=>line.startsWith(c.token,p)))p++;parts.push(esc(line.slice(start,p)))}}return `<div class="codeline"><span class="lineno" aria-hidden="true">${n+1}</span><span>${parts.join('')||' '}</span></div>`}).join('')}
function explanation(l){let c=l.concepts[selected]||l.concepts[0];return `<div class="eyebrow">CODE LENS · ${selected+1}/${l.concepts.length}</div><h3>${esc(c.name)}</h3>${c.token?`<div class="explaincode mono">${esc(c.token)}</div>`:''}<p>${esc(c.desc)}</p><div class="toolbar"><button data-step="-1" ${selected===0?'disabled':''} aria-label="Previous concept">←</button><button data-step="1" ${selected===l.concepts.length-1?'disabled':''} aria-label="Next concept">→</button><button data-learn="${selected}" class="${state.learned[l.id]?.includes(selected)?'completebtn':''}">${state.learned[l.id]?.includes(selected)?'✓ Learned (undo)':'Mark concept learned +5 XP'}</button></div>`}
function conceptList(l){return l.concepts.map((c,i)=>`<div class="concept ${selected===i?'selected':''}"><input type="checkbox" data-check="${i}" aria-label="Mark ${esc(c.name)} learned" ${state.learned[l.id]?.includes(i)?'checked':''}><div><button data-concept="${i}">${String(i+1).padStart(2,'0')} · ${esc(c.name)}</button>${c.token?`<code>${esc(c.token)}</code>`:''}${selected===i?`<p>${esc(c.desc)}</p>`:''}</div></div>`).join('')}
function quizQuestions(l){let len=l.concepts.length,seed=l.id.split('-').reduce((a,x)=>a+x.charCodeAt(0),0);let indices=[seed%len,(seed+Math.floor(len/3))%len,(seed+Math.floor(2*len/3))%len];return indices.map((i,j)=>{let others=[];for(let k=1;others.length<3&&k<len;k++){let x=(i+k+j)%len;if(x!==i&&!others.includes(x))others.push(x)}let options=[i,...others].sort((a,b)=>((a*17+seed+j*11)%23)-((b*17+seed+j*11)%23));return {i,options}})}
function quizHTML(l){let q=quizSession[l.id]||{answers:{},graded:false},qs=quizQuestions(l),score=qs.filter((x,j)=>q.answers[j]===x.i).length;return `<div class="eyebrow">KNOWLEDGE CHECK · +30 XP FOR 3/3</div><h2>Recall challenge</h2><p class="muted" style="font-size:13px">Match each explanation to the correct programming concept. Retry as often as you like. Best result: ${state.quiz[l.id]??0}/3.</p>${qs.map((x,j)=>`<div class="question"><div class="eyebrow">QUESTION ${j+1}</div><p>${esc(l.concepts[x.i].desc)}</p><div class="qoptions">${x.options.map(i=>`<button class="qoption ${q.graded&&i===x.i?'correct':q.graded&&q.answers[j]===i?'wrong':q.answers[j]===i?'chosen':''}" data-answer="${j}:${i}" aria-pressed="${q.answers[j]===i}" ${q.graded?'disabled':''}>${esc(l.concepts[i].name)}</button>`).join('')}</div>${q.graded?`<div class="feedback">${q.answers[j]===x.i?'✓ Correct':'Correct answer: '+esc(l.concepts[x.i].name)}</div>`:''}</div>`).join('')}<div class="toolbar">${q.graded?`<strong>${score}/3 correct${score===3?' · Perfect!':''}</strong><button data-action="retryquiz">Retry quiz</button>`:`<button class="primary" data-action="gradequiz" ${Object.keys(q.answers).length===3?'':'disabled'}>Check answers</button>`}</div>`}
function labHTML(l){let t=l.track,idx=Number(l.id.split('-')[1]);if(idx!==1)return '';let cfg={t0:['Integer arithmetic','Adjust two values; compare addition, bitwise AND and OR.','a','b'],t1:['Message dispatch','Choose a receiver and selector to see a conceptual message result.'],t2:['Reference aliasing','Change an original value and see the reference observe it.'],t3:['String bridging','Enter text to see the UTF-8 byte length versus UTF-16 code units.'],t4:['W-register arithmetic','Adjust a 32-bit input; the simulator adds a constant and shows the register value.'],t5:['Optional fallback','Choose whether a value exists and observe the nil-coalescing expression.'],t6:['Quoting and word splitting','Enter a value; compare quoted versus simple unquoted space splitting.'],t7:['Dependency rebuild','Choose a newer source or header; see which targets need rebuilding.']}[t];let inner='';if(t==='t0')inner=`<div class="labbox"><label for="labA">a</label><input id="labA" type="range" min="0" max="255" value="5"></div><div class="labbox"><label for="labB">b</label><input id="labB" type="range" min="0" max="255" value="3"></div>`;if(t==='t1')inner=`<div class="labbox"><label for="labA">Receiver</label><select id="labA"><option>Note</option><option>OtherNote</option><option>nil</option></select></div><div class="labbox"><label for="labB">Selector</label><select id="labB"><option>title</option><option>description</option></select></div>`;if(t==='t2'||t==='t4')inner=`<div class="labbox"><label for="labA">${t==='t2'?'Original n':'w0 before ADD'}</label><input id="labA" type="range" min="0" max="100" value="42"></div>`;if(t==='t3'||t==='t6')inner=`<div class="labbox"><label for="labA">Input text</label><input id="labA" type="text" maxlength="100" value="${t==='t3'?'Hello 🌍':'sample project'}" style="width:100%;background:var(--panel);color:inherit;border:1px solid var(--line);padding:7px;border-radius:7px"></div>`;if(t==='t5')inner=`<div class="labbox"><label for="labA">Optional state</label><select id="labA"><option value="value">Some(42)</option><option value="nil">nil</option></select></div>`;if(t==='t7')inner=`<div class="labbox"><label for="labA">Changed file</label><select id="labA"><option>main.c</option><option>util.c</option><option>util.h</option><option>none</option></select></div>`;return `<section class="panel lab"><div class="eyebrow">INTERACTIVE MINI LAB · SIMULATION</div><h2>${cfg[0]}</h2><p class="muted" style="font-size:13px">${cfg[1]}</p><div class="labgrid">${inner}<div class="labbox"><label>Live result</label><div class="labresult" id="labResult" aria-live="polite"></div></div></div><p class="fineprint">Teaching model only; no native code or shell commands execute in the browser.</p></section>`}
function updateLab(l){let a=$('#labA'),r=$('#labResult');if(!a||!r)return;let x=a.value,y=$('#labB')?.value,t=l.track;let s='';if(t==='t0')s=`${x} + ${y} = ${+x+ +y}\n${x} & ${y} = ${x&y}\n${x} | ${y} = ${x|y}`;if(t==='t1')s=x==='nil'?'[nil '+y+'] → nil (object result)':`[${x} ${y}] → ${x==='Note'?'Note implementation':'OtherNote implementation'}`;if(t==='t2')s=`n = ${x}; int &ref = n;\nref == ${x}`;if(t==='t3')s=`UTF-8 bytes: ${new TextEncoder().encode(x).length}\nUTF-16 units: ${x.length}`;if(t==='t4')s=`ADD W0, W0, #5\nW0 = ${+x+5} (0x${(+x+5).toString(16)})`;if(t==='t5')s=`optional ?? 0 → ${x==='nil'?0:42}`;if(t==='t6')s=`Quoted: ${JSON.stringify([x])}\nUnquoted (simple whitespace): ${JSON.stringify(x.trim()?x.trim().split(/\s+/):[])}`;if(t==='t7')s=x==='none'?'No rebuild (assuming all outputs exist)':x==='util.h'?'main.o + util.o → app':x==='main.c'?'main.o → app':'util.o → app';r.textContent=s;r.style.whiteSpace='pre-wrap'}
function lessonView(l){let t=TRACKS.find(t=>t.id===l.track),i=t.lessons.findIndex(x=>x.id===l.id),k=state.learned[l.id]?.length||0;return `<div class="breadcrumbs"><button class="crumb" data-go="home">Dashboard</button> / <button class="crumb" data-go="${t.id}">${esc(t.name)}</button> / Quest ${i+1}</div><div class="lessonhead"><div class="eyebrow" style="color:${t.color}">${esc(t.name)} · QUEST ${i+1}/${t.lessons.length}</div><h1>${esc(l.title)}</h1><p>${esc(l.desc)}</p><div class="lessonactions"><button id="completeLesson" class="${state.completed[l.id]?'completebtn':'primary'}" data-action="complete">${state.completed[l.id]?'✓ Lesson complete — undo':'Mark entire lesson complete'}</button><small id="lessonCount">${k}/${l.concepts.length} concepts learned · ${k===l.concepts.length?'All concepts checked':'Self-paced'}</small></div></div><div class="lessonlayout"><section class="panel explorer"><div class="codeheader"><h2>Interactive code explorer</h2><button data-action="copycode">Copy code</button></div><div class="codewrap" id="codewrap" aria-label="Annotated code example">${codeHTML(l)}</div><div id="explain" class="explain" aria-live="polite">${explanation(l)}</div></section><section><h2>Concept checklist</h2><p class="muted" style="font-size:12px">Select a highlighted code fragment or a concept title to inspect it. Check concepts after you can explain them.</p><div class="concepts" id="conceptList">${conceptList(l)}</div></section></div>${labHTML(l)}<section id="quiz" class="panel quiz">${quizHTML(l)}</section><div class="footer-nav"><button data-go="${i?t.lessons[i-1].id:t.id}">← ${i?'Previous quest':'Back to track'}</button><button class="primary" data-go="${i<t.lessons.length-1?t.lessons[i+1].id:t.id}">${i<t.lessons.length-1?'Next quest':'Track overview'} →</button></div><p class="fineprint">Code is illustrative and may be a fragment requiring a particular SDK, compiler or enclosing function. It is not executed here. Practice locally in a suitable lab to verify your understanding.</p>`}
function progress(){let s=stats();return `<div class="eyebrow">PLAYER RECORD</div><h1>Progress & backup</h1><p class="muted" style="margin:10px 0 20px">Your learning record lives in this browser. Export a JSON backup before moving the HTML file, changing browsers or clearing site data.</p><div class="statgrid"><div class="stat"><strong>${s.xp}</strong><small>Total XP</small></div><div class="stat"><strong>${s.k}/${TOTAL_CONCEPTS}</strong><small>Concepts checked</small></div><div class="stat"><strong>${s.c}/${LESSONS.length}</strong><small>Lessons completed</small></div><div class="stat"><strong>${s.q}/${LESSONS.length}</strong><small>Perfect quizzes</small></div></div><div class="panel"><h2>Track progress</h2><table class="progressTable"><thead><tr><th>Language</th><th>Concepts</th><th>Quests</th><th>Progress</th></tr></thead><tbody>${TRACKS.map(t=>{let a=trackStats(t);return `<tr><td><button class="crumb" data-go="${t.id}">${esc(t.name)}</button></td><td>${a.k}/${a.n}</td><td>${a.c}/${t.lessons.length}</td><td>${a.p}%</td></tr>`}).join('')}</tbody></table></div><div class="sectionhead"><h2>Achievements</h2></div><div class="achievementgrid">${achievements()}</div><div class="sectionhead"><h2>Local data controls</h2></div><div class="panel"><p>${storageOK?'Browser storage is active.':'Browser storage is unavailable; use export to keep your work.'} Export and import include checklists, completion, best quiz scores and study dates. Import replaces the current record after confirmation.</p><div class="toolbar"><button class="primary" data-action="export">Export progress JSON</button><button data-action="import">Import backup</button><button class="danger" data-action="reset">Reset progress</button></div><p class="fineprint">XP is derived from current checks, lesson completion and perfect quiz scores; undoing a completion removes its associated XP. No account, telemetry, tracking or external requests.</p></div>`}
function searchView(q){let terms=q.toLowerCase().trim().split(/\s+/).filter(Boolean);let hits=LESSONS.filter(l=>{let t=TRACKS.find(t=>t.id===l.track);let hay=[t.name,l.title,l.desc,...l.concepts.flatMap(c=>[c.name,c.desc,c.token])].join(' ').toLowerCase();return terms.every(x=>hay.includes(x))});return `<div class="eyebrow">CURRICULUM SEARCH</div><h1>Search results</h1><p class="muted" style="margin:8px 0 18px">${hits.length} matching lessons for “${esc(q)}”.</p><div class="lessonlist">${hits.length?hits.map((l,i)=>lessonRow(l,i,true)).join(''):'<div class="empty">No matches. Try pointers, ARC, stack, variables or Makefile.</div>'}</div>`}
function render(){let r=location.hash.slice(1)||'home',q=$('#search').value.trim(),l=BY_ID[r];if(r!==currentRoute){selected=0;filter='all';currentRoute=r;window.scrollTo(0,0)}if(l&&state.last!==r){state.last=r;persist()}updateChrome();let t=TRACKS.find(t=>t.id===r);$('#content').innerHTML=(!storageOK?'<div class="warning">Progress cannot currently be saved to browser storage. Export a backup before closing.</div>':'')+(q?searchView(q):l?lessonView(l):t?trackView(t):r==='progress'?progress():home());if(l&&!q)updateLab(l)}
function currentLesson(){return BY_ID[location.hash.slice(1)]}
function refreshLesson(l,code=false){let el=$('#explain');if(!el)return;if(code){let w=$('#codewrap'),top=w.scrollTop,left=w.scrollLeft;w.innerHTML=codeHTML(l);w.scrollTop=top;w.scrollLeft=left}el.innerHTML=explanation(l);$('#conceptList').innerHTML=conceptList(l);let k=state.learned[l.id]?.length||0;$('#lessonCount').textContent=`${k}/${l.concepts.length} concepts learned · ${k===l.concepts.length?'All concepts checked':'Self-paced'}`;let b=$('#completeLesson');b.className=state.completed[l.id]?'completebtn':'primary';b.textContent=state.completed[l.id]?'✓ Lesson complete — undo':'Mark entire lesson complete'}
function selectConcept(l,i,fromList=false){selected=Math.max(0,Math.min(l.concepts.length-1,i));refreshLesson(l,true);if(fromList){let w=$('#codewrap'),sel=w.querySelector('.codehit.sel');if(sel){let a=sel.getBoundingClientRect(),b=w.getBoundingClientRect();if(a.top<b.top||a.bottom>b.bottom)w.scrollTop+=a.top-b.top-30;if(a.left<b.left||a.right>b.right)w.scrollLeft+=a.left-b.left-45}}}
function toggleConcept(l,i,value){let set=new Set(state.learned[l.id]||[]);let was=set.has(i);if(value)set.add(i);else {set.delete(i);delete state.completed[l.id]}state.learned[l.id]=[...set].sort((a,b)=>a-b);persist(value&&!was);refreshLesson(l);if(value&&!was)toast('+5 XP · Concept learned')}
async function copyCode(text){try{await navigator.clipboard.writeText(text);toast('Code copied')}catch(e){let a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();toast(ok?'Code copied':'Clipboard unavailable; select code manually.')}}
function exportProgress(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`kernel-quest-progress-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress backup prepared')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset,l=currentLesson();if(d.go){$('#search').value='';go(d.go);return}if(d.concept!==undefined&&l){selectConcept(l,+d.concept,!!b.closest('.concept'));return}if(d.step!==undefined&&l){selectConcept(l,selected+ +d.step,true);return}if(d.learn!==undefined&&l){let i=+d.learn;toggleConcept(l,i,!state.learned[l.id]?.includes(i));return}if(d.answer&&l){let [j,i]=d.answer.split(':').map(Number),q=quizSession[l.id]||{answers:{},graded:false};if(q.graded)return;q.answers[j]=i;quizSession[l.id]=q;$('#quiz').innerHTML=quizHTML(l);return}switch(d.action){case'complete':if(!l)return;if(state.completed[l.id]){delete state.completed[l.id];persist();toast('Lesson completion undone; concept checks kept')}else{let old=state.learned[l.id]?.length||0;state.learned[l.id]=l.concepts.map((_,i)=>i);state.completed[l.id]=true;persist(true);toast(`+${25+(l.concepts.length-old)*5} XP · Quest cleared`)}refreshLesson(l);break;case'copycode':if(l)copyCode(l.code);break;case'gradequiz':if(!l)return;{let q=quizSession[l.id];if(!q||Object.keys(q.answers).length!==3||q.graded)return;q.graded=true;let score=quizQuestions(l).filter((x,j)=>q.answers[j]===x.i).length,old=state.quiz[l.id]||0;state.quiz[l.id]=Math.max(old,score);persist(true);$('#quiz').innerHTML=quizHTML(l);toast(score===3&&old!==3?'+30 XP · Perfect quiz':`${score}/3 · Quiz checked`)}break;case'retryquiz':if(l){delete quizSession[l.id];$('#quiz').innerHTML=quizHTML(l)}break;case'export':exportProgress();break;case'import':$('#importfile').click();break;case'reset':if(confirm('Reset all learning progress in this browser? Export a backup first if needed.')){state=empty();quizSession={};persist();render();toast('Progress reset')}break}});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){let l=currentLesson();if(l)toggleConcept(l,+e.target.dataset.check,e.target.checked)}if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='labA'||e.target.id==='labB'){let l=currentLesson();if(l)updateLab(l)}});document.addEventListener('input',e=>{if(e.target.id==='labA'||e.target.id==='labB'){let l=currentLesson();if(l)updateLab(l)}});
$('#importfile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>2_000_000)throw Error('Backup is too large.');let next=sanitize(JSON.parse(await f.text()));if(confirm('Replace current progress with this backup?')){state=next;quizSession={};persist();render();toast('Backup restored')}}catch(err){toast('Could not import: '+err.message)}e.target.value=''});$('#search').addEventListener('input',()=>{render();window.scrollTo(0,0)});$('#levelpill').addEventListener('click',()=>{$('#search').value='';go('progress')});$('#menu').addEventListener('click',()=>{let open=$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('open',open);$('#menu').setAttribute('aria-expanded',String(open))});$('#overlay').addEventListener('click',closeMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if($('#search').value){$('#search').value='';render()}}});window.addEventListener('hashchange',()=>{render();closeMenu()});window.addEventListener('storage',e=>{if(e.key===KEY){try{state=e.newValue?sanitize(JSON.parse(e.newValue)):empty();render()}catch(_){}}});render();
</script></body></html>
