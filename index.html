</style></head><body><a class="skip" href="#main">Skip to content</a><div class="layout"><aside id="sidebar" class="sidebar" aria-label="Navigation"></aside><button class="overlay" id="overlay" aria-label="Close navigation"></button><main class="main" id="main"><header class="topbar"><button class="mobile-menu" id="menu" aria-label="Open navigation" aria-expanded="false">☰</button><div class="search"><input id="search" type="search" placeholder="Search lessons or concepts…" aria-label="Search lessons and concepts" autocomplete="off"></div><button id="levelpill" class="levelpill" title="View progress">LV 01 · 0 XP</button></header><div class="content" id="content"></div></main></div><div class="toast" id="toast" role="status" hidden></div><input type="file" id="importfile" accept="application/json,.json" hidden><script id="curriculum" type="application/json">[{"id": "t0", "name": "C", "short": "C", "desc": "Core systems language", "color": "#65d9bd", "lessons": [{"id": "t0-1", "title": "Basics: declarations and scope", "desc": "Understand how a C program stores values and organizes execution.", "code": "#include <stdio.h>\nstatic int total = 0;\nint main(void) {\n    const int limit = 3;\n    int count;\n    count = 2;\n    total += count;\n    printf(\"%d\\n\", total);\n    return 0;\n}", "concepts": [{"token": "#include", "name": "Header inclusion", "desc": "Imports declarations from a header during preprocessing; stdio.h declares printf."}, {"token": "static int total", "name": "Global and static storage", "desc": "A file-scope static object exists throughout execution and has internal linkage; other source files cannot refer to it by name."}, {"token": "int main(void)", "name": "Entry point and function", "desc": "main is the conventional hosted C entry point; void indicates no parameters and int is the exit status type."}, {"token": "const int limit = 3", "name": "Constants and initialization", "desc": "Initializes a read-only-qualified integer. const prevents ordinary assignment through this name, not all possible changes to storage."}, {"token": "int count;", "name": "Variable declaration", "desc": "Introduces a local integer with automatic storage duration. Its value is indeterminate until initialized or assigned."}, {"token": "count = 2", "name": "Assignment", "desc": "Stores a value in an existing object; this differs from initialization at declaration."}, {"token": "total += count", "name": "Compound assignment and scope", "desc": "Adds count to total and stores the result. count is local to main; total is visible throughout this file after its declaration."}, {"token": "printf", "name": "Formatted output", "desc": "Writes text to stdout; %d expects an int and \\n represents a newline."}, {"token": "return 0", "name": "Return and exit status", "desc": "Returns from main; zero conventionally means success."}]}, {"id": "t0-2", "title": "Data types and representation", "desc": "Read numeric types, aliases, conversions and representation safely.", "code": "#include <stdint.h>\n#include <stddef.h>\n#include <stdbool.h>\ntypedef uint64_t address_t;\nint8_t small = -4;\nuint8_t byte = 0xFF;\nuint16_t half = 0755;\nuint32_t word = 42;\naddress_t address = (uint64_t)word;\nsize_t length = sizeof(address);\nptrdiff_t delta = -1;\nbool ready = true;\nchar letter = 'A';\ndouble ratio = 0.5;", "concepts": [{"token": "typedef", "name": "Type aliases", "desc": "Creates another name for an existing type, not a new distinct type."}, {"token": "int8_t", "name": "Signed fixed-width types", "desc": "Signed fixed-width integers represent negative and positive values; int8_t is exactly 8 bits when provided. int16_t, int32_t and int64_t follow the same pattern."}, {"token": "uint8_t", "name": "Unsigned fixed-width types", "desc": "An unsigned 8-bit type represents 0 through 255; unsigned arithmetic wraps modulo its width after applicable promotions."}, {"token": "0xFF", "name": "Hexadecimal literals", "desc": "Base 16 uses digits 0–9 and A–F. Each hexadecimal digit corresponds to four bits."}, {"token": "0755", "name": "Octal literals", "desc": "A leading zero denotes base eight in traditional C integer syntax. It is often used for POSIX permission modes."}, {"token": "uint16_t", "name": "Integer widths", "desc": "Fixed-width uint16_t, uint32_t and uint64_t hold exactly 16, 32 and 64 bits respectively when available."}, {"token": "(uint64_t)word", "name": "Explicit and implicit conversions", "desc": "A cast requests conversion to a named type. Assignment can also convert implicitly; narrowing may lose information."}, {"token": "size_t", "name": "Size and signed size types", "desc": "size_t is unsigned and used for object sizes; POSIX ssize_t can represent a negative error result. ptrdiff_t represents pointer differences."}, {"token": "sizeof(address)", "name": "Size and alignment", "desc": "sizeof yields object size in bytes; _Alignof yields alignment requirements in C11. Pointer-sized integers uintptr_t and intptr_t can hold converted object pointer values when provided."}, {"token": "bool ready = true", "name": "Booleans", "desc": "stdbool.h provides bool, true and false in traditional C versions; conditions treat zero as false."}, {"token": "char letter = 'A'", "name": "Characters", "desc": "char stores a character code or byte-sized value; plain char signedness depends on the implementation."}, {"token": "double ratio = 0.5", "name": "Floating point", "desc": "float and double represent approximate real numbers; rounding and precision differ from integers."}]}, {"id": "t0-3", "title": "Operators and bit manipulation", "desc": "Evaluate expressions, flags, masks and conversions.", "code": "unsigned flags = 0x05;\nunsigned mask = 1u << 2;\nflags |= mask;\nunsigned bit = (flags & mask) != 0;\nunsigned flipped = flags ^ mask;\nunsigned cleared = flags & ~mask;\nunsigned shifted = flags >> 1;\nint result = (7 + 3) * 2 / 5 % 3;\nint choice = bit && result ? 1 : 0;\nchoice++;", "concepts": [{"token": "1u << 2", "name": "Left shift", "desc": "Moves bits left; unsigned operands make flag masks easier to reason about. Shift counts must be within the promoted operand width."}, {"token": "flags |= mask", "name": "Bitwise OR and assignment", "desc": "Sets bits selected by the mask without changing other bits. Compound assignment combines an operation with storage."}, {"token": "flags & mask", "name": "Bitwise AND", "desc": "Keeps bits present in both operands; commonly checks whether a flag is present."}, {"token": "!= 0", "name": "Comparisons", "desc": "Equality and relational operators produce 0 or 1 in C; == compares whereas = assigns."}, {"token": "flags ^ mask", "name": "Bitwise XOR", "desc": "Produces 1 where bits differ; toggles selected bits when applied with a mask."}, {"token": "~mask", "name": "Bitwise NOT", "desc": "Complements every bit of the promoted operand. Use matching unsigned widths when manipulating flags."}, {"token": "flags >> 1", "name": "Right shift", "desc": "Moves bits right; unsigned right shift fills with zeros."}, {"token": "(7 + 3) * 2 / 5 % 3", "name": "Arithmetic and precedence", "desc": "Parentheses override precedence. Integer division truncates toward zero and % computes the remainder. Signed overflow is undefined in C."}, {"token": "bit && result", "name": "Logical operators", "desc": "&& and || short-circuit; ! negates truth. They are different from bitwise operations."}, {"token": "? 1 : 0", "name": "Conditional operator", "desc": "Evaluates only one of the two result expressions depending on the condition."}, {"token": "choice++", "name": "Increment and decrement", "desc": "Postfix ++ produces the old value then increments; prefix ++ produces the updated value. Avoid unsequenced modifications."}]}, {"id": "t0-4", "title": "Conditions and loops", "desc": "Follow branches, loops, early returns and cleanup.", "code": "int classify(int n) {\n    if (n < 0) return -1;\n    else if (n == 0) return 0;\n    else {\n        for (int i = 0; i < n; i++) {\n            if (i == 2) continue;\n            if (i == 5) break;\n        }\n    }\n    while (n > 3) n--;\n    do { n--; } while (n > 1);\n    switch (n) {\n        case 0: return 0;\n        default: goto cleanup;\n    }\ncleanup:\n    return 1;\n}", "concepts": [{"token": "if (n < 0)", "name": "If and early return", "desc": "Executes the guarded statement only when the condition is nonzero. Early returns simplify exceptional cases."}, {"token": "else if", "name": "Else-if and else", "desc": "Tests another condition only when the preceding condition was false. else handles remaining cases."}, {"token": "for (int i = 0; i < n; i++)", "name": "For loop", "desc": "Runs initialization once, condition before each iteration, and increment after each iteration; loop-local variables have limited scope."}, {"token": "continue", "name": "Continue", "desc": "Skips the remainder of the current iteration; a for loop still executes its increment expression."}, {"token": "break", "name": "Break", "desc": "Exits the nearest loop or switch, not the entire function."}, {"token": "while (n > 3)", "name": "While loop", "desc": "Checks the condition before every iteration; may execute zero times. while (1) is an intentional infinite loop until an exit."}, {"token": "do { n--; } while (n > 1)", "name": "Do-while loop", "desc": "Runs its body at least once, then tests the condition."}, {"token": "switch (n)", "name": "Switch, cases and default", "desc": "Selects an integral case label; execution can fall through unless a break, return or other jump intervenes."}, {"token": "goto cleanup", "name": "Labels and goto", "desc": "Transfers control to a label in the same function. A common systems pattern uses a shared cleanup path for errors."}]}, {"id": "t0-5", "title": "Functions, callbacks and variadic arguments", "desc": "Learn declarations, definitions, outputs and indirect calls.", "code": "#include <stdarg.h>\nstatic inline int twice(int x) { return x * 2; }\nint sum(int a, int b);\nint sum(int a, int b) { return a + b; }\nvoid output(int *out) { *out = 7; }\nint factorial(int n) { return n <= 1 ? 1 : n * factorial(n-1); }\nint apply(int x, int (*fn)(int)) { return fn(x); }\nint first(int count, ...) {\n    va_list ap; va_start(ap, count);\n    int value = count ? va_arg(ap, int) : 0;\n    va_end(ap); return value;\n}", "concepts": [{"token": "static inline", "name": "Static and inline functions", "desc": "static restricts linkage; inline allows inline definitions under language linkage rules and does not force optimization."}, {"token": "int sum(int a, int b);", "name": "Prototype and forward declaration", "desc": "Declares parameter and return types before the definition so calls can be type-checked."}, {"token": "return a + b", "name": "Return values and pass by value", "desc": "C passes parameters by value; changes to a local parameter do not change the caller's object."}, {"token": "int *out", "name": "Output parameters", "desc": "Pass a valid address to let a function modify caller-owned storage. The pointer itself is passed by value."}, {"token": "factorial(n-1)", "name": "Recursion", "desc": "A function calls itself with a smaller problem and a stopping condition. Deep recursion can exhaust stack space."}, {"token": "int (*fn)(int)", "name": "Function pointer and callback", "desc": "A typed pointer to a function taking int and returning int. Calling fn invokes the supplied implementation."}, {"token": "...", "name": "Variadic functions", "desc": "Accepts additional arguments after named ones. The caller and callee must agree on their types and count."}, {"token": "va_start", "name": "Variadic argument traversal", "desc": "Initializes a va_list; va_arg reads the next promoted argument and va_end releases traversal state."}]}, {"id": "t0-6", "title": "Pointers and indirection", "desc": "Understand addresses, dereferences, levels and lifetime.", "code": "#include <stdint.h>\nint value = 42;\nint *ptr = &value;\nint **pp = &ptr;\nint ***ppp = &pp;\nvoid *generic = ptr;\nconst int *read_only = ptr;\nint *const fixed = ptr;\nuintptr_t bits = (uintptr_t)ptr;\nint arr[3] = {10,20,30};\nint *next = arr + 1;\nint (*whole)[3] = &arr;\nint *refs[2] = {ptr, next};", "concepts": [{"token": "&value", "name": "Address-of operator", "desc": "Obtains the address of an object. A pointer stores a value designating storage rather than the stored integer itself."}, {"token": "int *ptr", "name": "Pointer declaration and dereference", "desc": "Declares a pointer to int; *ptr accesses the referenced object if the pointer is valid and suitably aligned."}, {"token": "int **pp", "name": "Double and triple pointers", "desc": "A pointer can refer to another pointer; **pp reaches value. Triple pointers add another level of indirection."}, {"token": "void *generic", "name": "Generic pointer", "desc": "void* can hold an object pointer without its pointed-to type. Convert back to an appropriate type before dereferencing."}, {"token": "const int *read_only", "name": "Pointer to const", "desc": "Prevents modification of the referenced int through this pointer, but the pointer can be reassigned."}, {"token": "int *const fixed", "name": "Const pointer", "desc": "The pointer cannot be reassigned after initialization; the pointed-to int may still be mutable."}, {"token": "(uintptr_t)ptr", "name": "Pointer conversions", "desc": "uintptr_t can hold an object pointer converted to an integer when available; converting arbitrary integers to pointers does not guarantee valid storage."}, {"token": "arr + 1", "name": "Pointer arithmetic and comparison", "desc": "Advances by one element, not one byte. Arithmetic and ordering are generally restricted to a single array object and its one-past position."}, {"token": "int (*whole)[3]", "name": "Pointer to array", "desc": "Points at an entire three-element array. Parentheses distinguish it from an array of pointers."}, {"token": "int *refs[2]", "name": "Array of pointers and aliasing", "desc": "Stores two pointer values. Different pointers may refer to the same object; respect lifetime, alignment and effective-type rules."}]}, {"id": "t0-7", "title": "Arrays, strings and binary buffers", "desc": "Distinguish text, byte arrays, lengths and bounds.", "code": "#include <string.h>\n#include <stdio.h>\n#include <stdint.h>\nint matrix[2][3] = {{1,2,3},{4,5,6}};\nchar name[16] = \"sample\";\nconst char *text = \"hello\";\nsize_t len = strlen(text);\nint same = strcmp(name, text) == 0;\nconst char *found = strchr(text, 'e');\nchar out[32];\nsnprintf(out, sizeof out, \"%s\", text);\nuint8_t bytes[] = {0x00,0xFF};\nmemcpy(out, bytes, sizeof bytes);", "concepts": [{"token": "matrix[2][3]", "name": "Multidimensional arrays", "desc": "A contiguous array of arrays; indexes select rows and columns. Every index must remain within its own dimension."}, {"token": "char name[16]", "name": "Fixed arrays and initialization", "desc": "Allocates 16 chars; the string initializer includes a terminating zero and remaining bytes are zero-initialized."}, {"token": "const char *text", "name": "String literals and array decay", "desc": "String literals are arrays with static lifetime. In many expressions arrays decay into pointers to their first element; modifying a literal is undefined."}, {"token": "strlen(text)", "name": "String length", "desc": "Counts bytes before the first NUL, not buffer capacity. Requires a valid terminated string."}, {"token": "strcmp(name, text)", "name": "String comparisons", "desc": "Returns a negative, zero or positive result based on lexicographic order; strncmp limits compared bytes, not necessarily string length."}, {"token": "strchr", "name": "Searching and duplication", "desc": "strchr finds a character; strstr finds a substring; POSIX strdup creates a separately allocated copy that must be freed."}, {"token": "snprintf", "name": "Bounded formatting", "desc": "Writes at most capacity bytes including the terminator when capacity is nonzero; check its return to detect truncation."}, {"token": "uint8_t bytes[]", "name": "Binary buffers", "desc": "Raw bytes may contain zero values. Keep an explicit length rather than using string functions."}, {"token": "memcpy(out, bytes, sizeof bytes)", "name": "Byte copying and bounds", "desc": "Copies exactly the requested number of bytes; source and destination must have sufficient valid storage and must not overlap."}]}, {"id": "t0-8", "title": "Structures, unions, enums and layout", "desc": "Understand composite types and ABI-dependent memory layout.", "code": "#include <stddef.h>\n#include <stdint.h>\nenum Mode { IDLE, READY };\nstruct Node {\n    uint32_t id;\n    unsigned active : 1;\n    struct Node *next;\n};\nstruct Record { uint8_t tag; uint64_t value; };\nstruct Record item = {.tag = 1, .value = 42};\nstruct Record *p = &item;\nunion Payload { uint32_t word; uint8_t bytes[4]; };\nstruct Packet { size_t length; unsigned char data[]; };\nsize_t offset = offsetof(struct Record, value);", "concepts": [{"token": "enum Mode", "name": "Enumeration", "desc": "Names integer constants; useful for explicit states. The representation of enum objects depends on the language and compiler."}, {"token": "struct Node", "name": "Structure declaration", "desc": "Groups fields into one object. Structures may contain nested structures, arrays and pointers."}, {"token": "unsigned active : 1", "name": "Bitfields", "desc": "Allocates a specified number of bits for a member; ordering and packing are implementation-dependent."}, {"token": "struct Node *next", "name": "Self-referential structure", "desc": "A pointer to the same structure type enables linked nodes without requiring an infinitely sized object."}, {"token": "struct Record", "name": "Alignment and padding", "desc": "Compilers may insert padding between members and at the end; do not assume size is the sum of member sizes."}, {"token": ".tag = 1", "name": "Designated initialization", "desc": "Initializes members by name; unspecified members are zero-initialized in this initializer."}, {"token": "struct Record *p", "name": "Member access", "desc": "Use item.value for an object and p->value for a pointer; the latter means (*p).value."}, {"token": "union Payload", "name": "Unions", "desc": "Members share storage. Reading a different member has language-specific representation rules; beware portability and aliasing."}, {"token": "unsigned char data[]", "name": "Flexible array member", "desc": "A trailing unsized array in a structure; allocate extra storage and validate its actual length."}, {"token": "offsetof", "name": "Offsets and packed structures", "desc": "Returns the byte offset of a non-bitfield member. Compiler packed attributes can remove padding but may introduce unaligned accesses."}]}, {"id": "t0-9", "title": "Allocation, ownership and byte operations", "desc": "Manage memory and avoid common lifetime errors.", "code": "#include <stdlib.h>\n#include <string.h>\nint demo(size_t n) {\n    if (n > 1024) return 1;\n    unsigned char *p = calloc(n + 1, 1);\n    if (!p) return 1;\n    unsigned char *tmp = realloc(p, n + 2);\n    if (!tmp) { free(p); return 1; }\n    p = tmp;\n    memset(p, 0, n + 2);\n    if (n > 1) memmove(p + 1, p, n);\n    int same = memcmp(p, p, n);\n    free(p); p = NULL;\n    return same;\n}", "concepts": [{"token": "calloc(n + 1, 1)", "name": "Heap allocation", "desc": "Allocates zero-initialized storage. malloc allocates uninitialized bytes; check size arithmetic and failure before use."}, {"token": "if (!p)", "name": "Null checking", "desc": "Allocation may fail; do not dereference a null pointer. A zero-size allocation has special rules."}, {"token": "realloc(p, n + 2)", "name": "Resizing", "desc": "May move the allocation. On failure with a nonzero requested size the original allocation remains valid; use a temporary pointer."}, {"token": "free(p)", "name": "Ownership and release", "desc": "Release a heap allocation exactly once with its matching allocator; never free stack storage or interior pointers."}, {"token": "memset", "name": "Byte initialization", "desc": "Fills bytes with a repeated unsigned-char value. It does not initialize arbitrary typed values portably to that numeric value."}, {"token": "memmove", "name": "Overlapping copies", "desc": "Unlike memcpy, memmove permits overlapping source and destination regions. Both must still be valid for the requested size."}, {"token": "memcmp", "name": "Binary comparison", "desc": "Compares bytes, not logical object equality; padding and floating-point representations can complicate object comparisons."}, {"token": "p = NULL", "name": "Lifetime and dangling pointers", "desc": "Clearing one pointer after release does not clear aliases. Accessing released memory is use-after-free; repeated release is double-free."}]}, {"id": "t0-10", "title": "Data structures and state machines", "desc": "Read the common building blocks used in native systems.", "code": "struct Node { int value; struct Node *next; };\nstruct Node *find(struct Node *head, int key) {\n    for (struct Node *p = head; p; p = p->next)\n        if (p->value == key) return p;\n    return 0;\n}\nenum State { INIT, ACTIVE, DONE };\nenum State step(enum State s) {\n    switch (s) {\n        case INIT: return ACTIVE;\n        case ACTIVE: return DONE;\n        default: return DONE;\n    }\n}", "concepts": [{"token": "struct Node *next", "name": "Linked lists", "desc": "Nodes reference successors. A doubly linked list also stores a predecessor, enabling bidirectional traversal."}, {"token": "p = p->next", "name": "Traversal and linear search", "desc": "Visits each reachable node until a match or end; worst-case linear time. Avoid cycles unless deliberately supported."}, {"token": "p->value == key", "name": "Lookup algorithms", "desc": "Linear search works on unsorted data; binary search halves a sorted search range. Hash tables map keys to buckets."}, {"token": "struct Node", "name": "Containers", "desc": "Stacks are LIFO, queues FIFO; trees model hierarchy, dynamic arrays resize, and bitmaps compactly represent flags. These are design choices, not special C syntax."}, {"token": "enum State", "name": "State representation", "desc": "A finite set of named states helps constrain allowable program behavior."}, {"token": "switch (s)", "name": "State transitions", "desc": "A state machine maps a state and optionally an event to a new state; explicit transitions improve testability."}]}, {"id": "t0-11", "title": "Preprocessor, linkage and compiler extensions", "desc": "Recognize source generation, platform conditions and compiler annotations.", "code": "#ifndef SAMPLE_H\n#define SAMPLE_H\n#include <stdint.h>\n#define FLAG(n) (1u << (n))\n#define STR(x) #x\n#define JOIN(a,b) a##b\n#define LOG(...) log_message(__VA_ARGS__)\n#if defined(__aarch64__)\n#define PLATFORM 64\n#else\n#define PLATFORM 0\n#endif\nextern int shared;\nstatic _Thread_local int local_count;\nvolatile unsigned status;\n_Static_assert(sizeof(uint64_t) == 8, \"width\");\n#endif", "concepts": [{"token": "#ifndef SAMPLE_H", "name": "Header guards", "desc": "Conditional preprocessing prevents multiple inclusion of the same declarations. pragma once is a widely supported alternative."}, {"token": "#define FLAG(n)", "name": "Function-like macros", "desc": "Textual substitution happens before compilation; parenthesize operands and avoid repeated side effects."}, {"token": "#x", "name": "Stringification", "desc": "Turns a macro argument into a string literal during preprocessing."}, {"token": "a##b", "name": "Token concatenation", "desc": "Joins preprocessing tokens into one token; commonly builds identifiers."}, {"token": "__VA_ARGS__", "name": "Variadic macros", "desc": "Forwards extra macro arguments; multiline macros use a backslash followed by newline."}, {"token": "#if defined(__aarch64__)", "name": "Conditional compilation", "desc": "Selects source text at build time based on macros; different architecture branches can compile different code."}, {"token": "extern int shared", "name": "External linkage", "desc": "Declares an object defined elsewhere; the linker resolves its symbol. A declaration is not necessarily a definition."}, {"token": "_Thread_local", "name": "Thread-local storage", "desc": "Each thread has its own instance, unlike a normal shared global. static gives the variable internal linkage here."}, {"token": "volatile unsigned status", "name": "Volatile and restrict", "desc": "volatile requires observable accesses but is not thread synchronization. restrict expresses pointer aliasing promises and must be respected."}, {"token": "_Static_assert", "name": "Compile-time validation", "desc": "Checks a constant condition at compile time; useful for ABI and layout assumptions. Compiler attributes can specify packing, visibility, weak linkage or constructors; builtins and inline asm are compiler extensions."}]}, {"id": "t0-12", "title": "Error handling and resource cleanup", "desc": "Track return values, errno and cleanup paths.", "code": "#include <stdio.h>\n#include <errno.h>\n#include <string.h>\n#include <assert.h>\nint inspect(const char *path) {\n    assert(path != NULL);\n    FILE *f = fopen(path, \"rb\");\n    if (!f) { fprintf(stderr, \"%s\\n\", strerror(errno)); return -1; }\n    int ch = fgetc(f);\n    int failed = ferror(f);\n    fclose(f);\n    if (failed) return -1;\n    return ch == EOF ? 0 : 1;\n}", "concepts": [{"token": "assert(path != NULL)", "name": "Assertions", "desc": "Express programmer invariants; assert may be disabled with NDEBUG, so never rely on it for required input validation."}, {"token": "fopen(path, \"rb\")", "name": "Resource acquisition", "desc": "Opening a file returns a stream or null; always define who closes it and on which paths."}, {"token": "if (!f)", "name": "Return-code checking", "desc": "Detect failure using the documented convention before using the result."}, {"token": "errno", "name": "Error information", "desc": "Read errno only after an API indicates failure; strerror turns it into text. perror is another reporting helper."}, {"token": "fprintf(stderr", "name": "Diagnostic logging", "desc": "Writes to standard error separately from normal stdout. Avoid logging secrets and use fixed format strings."}, {"token": "ferror(f)", "name": "End of file versus error", "desc": "EOF from a read may signal normal completion or failure; check the stream error indicator."}, {"token": "fclose(f)", "name": "Cleanup", "desc": "Release acquired resources even if later steps fail; production code may also need to check close errors."}]}, {"id": "t0-13", "title": "Threads, synchronization and atomics", "desc": "Understand safe shared-state access.", "code": "#include <pthread.h>\n#include <stdatomic.h>\nstatic pthread_mutex_t lock = PTHREAD_MUTEX_INITIALIZER;\nstatic int count;\nstatic atomic_int ready;\nvoid *worker(void *arg) {\n    pthread_mutex_lock(&lock);\n    count++;\n    pthread_mutex_unlock(&lock);\n    atomic_store_explicit(&ready, 1, memory_order_release);\n    return NULL;\n}\nint run(void) {\n    pthread_t t;\n    if (pthread_create(&t, NULL, worker, NULL)) return 1;\n    pthread_join(t, NULL);\n    return atomic_load_explicit(&ready, memory_order_acquire);\n}", "concepts": [{"token": "pthread_mutex_t", "name": "Mutex and critical section", "desc": "A mutex serializes access to shared state; initialize it and follow a consistent locking discipline."}, {"token": "pthread_mutex_lock", "name": "Locking", "desc": "Acquires the mutex before accessing protected data. Every successful lock needs a matching unlock."}, {"token": "pthread_mutex_unlock", "name": "Unlocking and deadlock", "desc": "Releases ownership; inconsistent lock ordering can cause deadlocks. Read-write locks distinguish readers and writers."}, {"token": "atomic_int", "name": "Atomic objects", "desc": "Atomic access prevents data races on the atomic itself; it does not make multi-object invariants automatically safe."}, {"token": "memory_order_release", "name": "Release ordering", "desc": "Publishes preceding writes to a reader that acquires the corresponding atomic value under the memory model."}, {"token": "memory_order_acquire", "name": "Acquire ordering", "desc": "Observes writes synchronized by a matching release. Relaxed operations do not provide that ordering; fences are another synchronization mechanism."}, {"token": "pthread_create", "name": "Thread creation", "desc": "Starts a function on a new thread; arguments and referenced storage must outlive their use."}, {"token": "pthread_join", "name": "Thread joining", "desc": "Waits for a thread to terminate. Condition variables wait for predicates, semaphores count available resources; thread safety and reentrancy are distinct."}]}, {"id": "t0-14", "title": "POSIX files and directories", "desc": "Understand descriptors, metadata, permissions and path operations.", "code": "#include <fcntl.h>\n#include <unistd.h>\n#include <sys/stat.h>\n#include <dirent.h>\nint inspect(const char *path) {\n    int fd = open(path, O_RDONLY);\n    if (fd < 0) return -1;\n    struct stat info;\n    if (fstat(fd, &info) < 0) { close(fd); return -1; }\n    char buf[64];\n    ssize_t n = read(fd, buf, sizeof buf);\n    close(fd);\n    return n < 0 ? -1 : 0;\n}", "concepts": [{"token": "open(path, O_RDONLY)", "name": "File descriptors and open", "desc": "Returns a nonnegative descriptor or -1; flags define access mode. A descriptor is a process-local integer handle."}, {"token": "fstat(fd, &info)", "name": "Metadata", "desc": "Queries the opened file; stat queries by path, lstat can inspect a link itself. Descriptor-based checks reduce some path races."}, {"token": "read(fd, buf, sizeof buf)", "name": "Read and write", "desc": "read returns bytes read, zero for EOF or -1 on error. write can be partial; loop appropriately rather than assuming all bytes were transferred."}, {"token": "ssize_t n", "name": "Signed byte counts", "desc": "Allows negative error results; validate before converting to unsigned size_t."}, {"token": "close(fd)", "name": "Descriptor lifetime", "desc": "Releases the descriptor; it may be reused later. lseek changes offsets for seekable files."}, {"token": "struct stat info", "name": "Permissions and filesystem operations", "desc": "Mode, ownership and type are metadata. chmod/chown change permissions/ownership; access checks path accessibility, not a guarantee of later access."}, {"token": "#include <dirent.h>", "name": "Directories and links", "desc": "opendir/readdir/closedir enumerate directory entries; symlink/readlink manipulate symbolic links. Treat paths as untrusted input in real applications."}]}, {"id": "t0-15", "title": "Processes, signals and IPC", "desc": "Learn process identity, environment and controlled communication.", "code": "#include <unistd.h>\n#include <sys/types.h>\n#include <sys/wait.h>\n#include <stdlib.h>\nint example(void) {\n    pid_t me = getpid();\n    uid_t user = getuid();\n    const char *home = getenv(\"HOME\");\n    int fds[2];\n    if (pipe(fds) == -1) return -1;\n    close(fds[0]); close(fds[1]);\n    return me > 0 && home != NULL && user >= 0;\n}", "concepts": [{"token": "pid_t me", "name": "Process identity", "desc": "pid_t stores process identifiers; getpid returns the current process ID. A process owns an address space and resources."}, {"token": "getuid()", "name": "Credentials", "desc": "UIDs and GIDs represent user/group identity; effective IDs can differ from real IDs. Permissions are enforced by the OS."}, {"token": "getenv(\"HOME\")", "name": "Environment variables", "desc": "getenv returns a borrowed pointer; setenv modifies process environment and may invalidate earlier pointers."}, {"token": "pipe(fds)", "name": "Pipes and IPC", "desc": "Creates read and write descriptors for a byte stream. UNIX sockets provide another local IPC channel with different addressing and semantics."}, {"token": "#include <sys/wait.h>", "name": "Process lifecycle", "desc": "posix_spawn starts a new process; execve replaces the current program image; waitpid collects child status. exit terminates a process."}, {"token": "#include <unistd.h>", "name": "Signals and system calls", "desc": "sigaction registers signal behavior; only async-signal-safe operations belong in signal handlers. System calls cross a controlled user/kernel boundary."}]}, {"id": "t0-16", "title": "Virtual memory and mappings", "desc": "Understand pages and permissions using an ordinary local buffer.", "code": "#include <sys/mman.h>\n#include <unistd.h>\nint demo(void) {\n    long page = sysconf(_SC_PAGESIZE);\n    if (page <= 0) return -1;\n    void *mem = mmap(NULL, (size_t)page, PROT_READ | PROT_WRITE,\n                     MAP_PRIVATE | MAP_ANON, -1, 0);\n    if (mem == MAP_FAILED) return -1;\n    ((char *)mem)[0] = 'A';\n    int rc = mprotect(mem, (size_t)page, PROT_READ);\n    munmap(mem, (size_t)page);\n    return rc;\n}", "concepts": [{"token": "_SC_PAGESIZE", "name": "Page size and alignment", "desc": "Virtual memory uses pages; page sizes vary by OS and device. Page-oriented APIs may require aligned addresses."}, {"token": "mmap", "name": "Virtual memory mapping", "desc": "Requests a region of virtual address space backed by anonymous memory or a file. It is not a direct physical-memory allocation API."}, {"token": "PROT_READ | PROT_WRITE", "name": "Page protections", "desc": "Specify access rights; read, write and execute permissions constrain CPU access through page tables."}, {"token": "MAP_PRIVATE", "name": "Private and shared mappings", "desc": "Private file-backed modifications usually use copy-on-write; shared mappings can communicate changes between processes."}, {"token": "MAP_FAILED", "name": "Mapping failure", "desc": "mmap returns MAP_FAILED, not necessarily NULL, on failure."}, {"token": "mprotect", "name": "Permission changes", "desc": "Changes protections on mapped pages subject to OS policy. Always check return status."}, {"token": "munmap", "name": "Unmapping", "desc": "Releases a mapping; pointers into the unmapped range are no longer valid. Fragmentation and page faults affect memory behavior."}]}, {"id": "t0-17", "title": "Dynamic linking, Mach-O and ABI", "desc": "Learn how native libraries and binary metadata are represented.", "code": "#include <dlfcn.h>\n#include <mach-o/loader.h>\n#include <stdint.h>\nint inspect_header(const struct mach_header_64 *header) {\n    if (!header || header->magic != MH_MAGIC_64) return -1;\n    return header->ncmds > 0;\n}\nvoid *library = 0;\nvoid load_example(void) {\n    library = dlopen(NULL, RTLD_LAZY);\n    if (library) { void *symbol = dlsym(library, \"printf\"); (void)symbol; dlclose(library); }\n}", "concepts": [{"token": "struct mach_header_64", "name": "Mach-O header", "desc": "A native Apple binary header describes architecture, file type and load-command metadata. Validate bounds when parsing actual bytes."}, {"token": "MH_MAGIC_64", "name": "Magic and byte order", "desc": "Magic identifies a format variant; universal binaries contain multiple architecture slices. Endianness affects interpretation."}, {"token": "header->ncmds", "name": "Load commands and sections", "desc": "Load commands describe segments, sections, dependencies and other loader metadata; counts alone do not prove the buffer is valid."}, {"token": "dlopen", "name": "Dynamic library loading", "desc": "Loads or opens a dynamic image or, with NULL, a handle to the main program's symbol scope according to platform rules."}, {"token": "dlsym", "name": "Symbol lookup", "desc": "Finds an exported symbol by name; use the documented error mechanism and correct function signature if calling a function."}, {"token": "dlclose", "name": "Library lifetime", "desc": "Releases a loader reference. A resolved pointer may become invalid when its image unloads."}, {"token": "#include <mach-o/loader.h>", "name": "ABI and relocation", "desc": "ABI defines calling conventions, type layout and binary interfaces. Static .a archives and dynamic .dylib images link differently; relocations adjust references."}]}, {"id": "t0-18", "title": "Memory safety and defensive reasoning", "desc": "Recognize defect classes without building weaponized examples.", "code": "#include <stddef.h>\n#include <string.h>\nint copy_checked(char *dst, size_t cap,\n                 const char *src, size_t n) {\n    if (!dst || !src || cap == 0) return -1;\n    if (n >= cap) return -1;\n    memmove(dst, src, n);\n    dst[n] = '\\0';\n    return 0;\n}", "concepts": [{"token": "!dst || !src", "name": "Null and uninitialized pointers", "desc": "Null checks reject absent pointers, but cannot prove arbitrary pointers are valid or initialized. Callers must satisfy object-lifetime contracts."}, {"token": "cap == 0", "name": "Boundary conditions", "desc": "Handle empty capacity before arithmetic or writes. Off-by-one errors often occur at zero, maximum or terminator boundaries."}, {"token": "n >= cap", "name": "Bounds and integer safety", "desc": "Reserve space for the terminator without overflowing n+1. Integer overflow, underflow and truncation can invalidate allocation or bounds calculations."}, {"token": "memmove(dst, src, n)", "name": "Out-of-bounds and overlap", "desc": "A valid copy requires n readable source bytes and n writable destination bytes. Stack and heap overflows differ in affected storage, not the need for bounds."}, {"token": "dst[n] = '\\0'", "name": "Lifetime and type safety", "desc": "Even a correct index is unsafe if storage has expired or the pointer has the wrong effective type. Use-after-free, double-free and type confusion are distinct defects."}, {"token": "return 0", "name": "Undefined behavior and review", "desc": "Memory leaks, reference-count errors, races and TOCTOU require separate reasoning. A successful return does not establish that all external preconditions were satisfied."}]}, {"id": "t0-19", "title": "XNU and Mach foundations", "desc": "Study operating-system interfaces without requiring a jailbroken device.", "code": "#include <mach/mach.h>\n#include <stdio.h>\nint main(void) {\n    mach_port_t self = mach_task_self();\n    mach_msg_type_number_t count = MACH_TASK_BASIC_INFO_COUNT;\n    mach_task_basic_info_data_t info;\n    kern_return_t rc = task_info(self, MACH_TASK_BASIC_INFO,\n        (task_info_t)&info, &count);\n    if (rc == KERN_SUCCESS) printf(\"resident: %llu\\n\", (unsigned long long)info.resident_size);\n    return rc != KERN_SUCCESS;\n}", "concepts": [{"token": "mach_task_self()", "name": "Mach tasks and ports", "desc": "A task represents an address space and resources; a port name refers to a kernel-managed IPC right in a task's namespace. Threads execute within tasks."}, {"token": "mach_msg_type_number_t", "name": "Mach IPC types", "desc": "Mach interfaces often accept message-related types and in/out counts; counts may be in units other than bytes."}, {"token": "task_info", "name": "Kernel API and permissions", "desc": "Queries task information through a documented interface. Kernel access depends on the supplied right and OS authorization."}, {"token": "(task_info_t)&info", "name": "ABI and out parameters", "desc": "The API writes a flavor-specific structure into caller storage; the declared count and type must match the selected flavor."}, {"token": "KERN_SUCCESS", "name": "Mach error conventions", "desc": "Mach uses kern_return_t result codes rather than assuming POSIX errno conventions."}, {"token": "info.resident_size", "name": "Kernel architecture", "desc": "Resident size describes memory resident for the task. XNU combines Mach, BSD and IOKit; VM maps, objects/pages, scheduling, vnodes and credentials are separate subsystems."}]}]}, {"id": "t1", "name": "Objective-C", "short": "ObjC", "desc": "iOS runtime and Foundation", "color": "#93aaff", "lessons": [{"id": "t1-1", "title": "Classes, objects and messages", "desc": "Learn the language extension on top of C.", "code": "#import <Foundation/Foundation.h>\n@interface Note : NSObject\n@property (nonatomic, copy) NSString *title;\n- (instancetype)initWithTitle:(NSString *)title;\n+ (NSString *)kind;\n@end\n@implementation Note\n- (instancetype)initWithTitle:(NSString *)title {\n    self = [super init];\n    if (self) { _title = [title copy]; }\n    return self;\n}\n+ (NSString *)kind { return @\"Note\"; }\n@end", "concepts": [{"token": "#import", "name": "Imports", "desc": "Like include, but avoids importing the same header multiple times. Objective-C inherits C declarations and preprocessor syntax."}, {"token": "@interface Note : NSObject", "name": "Class interface and inheritance", "desc": "Declares the class and its superclass. The interface exposes methods and properties; implementation supplies behavior."}, {"token": "@property (nonatomic, copy)", "name": "Properties and accessors", "desc": "Declares getter/setter accessors; copy stores a copied object, nonatomic does not promise atomic accessors."}, {"token": "- (instancetype)", "name": "Instance methods", "desc": "A minus introduces an instance method. instancetype lets the compiler infer the receiving object's type for initialization methods."}, {"token": "+ (NSString *)kind", "name": "Class methods", "desc": "A plus introduces a method on the class object rather than on an instance."}, {"token": "@implementation", "name": "Implementation and ivars", "desc": "Defines methods; an automatically synthesized property often has an ivar such as _title. @synthesize can explicitly choose backing storage."}, {"token": "[super init]", "name": "Messages and super", "desc": "Sends init using superclass method lookup while retaining the current receiver. Message syntax is not ordinary C function-call syntax."}, {"token": "self", "name": "Current object", "desc": "Refers to the receiver; initializers may return a different object or nil, so assign the result of superclass initialization."}, {"token": "[title copy]", "name": "Ownership and nested messages", "desc": "Sends copy to title; [[Note alloc] initWithTitle:...] nests object allocation and initialization."}]}, {"id": "t1-2", "title": "Foundation collections and literals", "desc": "Read object types, collection traversal and text APIs.", "code": "#import <Foundation/Foundation.h>\nNSString *name = @\"sample\";\nNSNumber *count = @(3);\nNSArray *items = @[name, @\"other\"];\nNSDictionary *map = @{@\"name\": name, @\"count\": count};\nNSMutableArray *mutable = [items mutableCopy];\n[mutable addObject:@\"new\"];\nfor (NSString *item in mutable) { NSLog(@\"%@\", item); }\nNSData *bytes = [name dataUsingEncoding:NSUTF8StringEncoding];\nNSSet *unique = [NSSet setWithArray:items];", "concepts": [{"token": "NSString *name", "name": "String objects", "desc": "NSString is immutable text; NSMutableString supports changes. It differs from a C NUL-terminated char buffer."}, {"token": "@(3)", "name": "Boxed values", "desc": "Wraps a scalar in an NSNumber object. Literal @3 is another shorthand."}, {"token": "@[name, @\"other\"]", "name": "Array literals", "desc": "Creates an immutable NSArray; object elements must not be nil. Subscript syntax can access array positions."}, {"token": "@{@\"name\": name, @\"count\": count}", "name": "Dictionary literals", "desc": "Maps object keys to values; keys generally conform to NSCopying. NSDictionary is immutable; NSMutableDictionary supports changes."}, {"token": "[items mutableCopy]", "name": "Mutable collections", "desc": "Creates a mutable container from an existing collection; contained objects are not necessarily deep-copied."}, {"token": "for (NSString *item in mutable)", "name": "Fast enumeration", "desc": "Iterates objects through the collection protocol. Mutating a collection while enumerating it is generally invalid."}, {"token": "NSLog", "name": "Object formatting", "desc": "%@ formats an Objective-C object description; use fixed format strings for externally supplied text."}, {"token": "NSData *bytes", "name": "Binary data", "desc": "NSData holds bytes and an explicit length; NSMutableData supports modification. Encoding converts text into bytes."}, {"token": "NSSet *unique", "name": "Sets", "desc": "Stores unique objects according to equality and hash semantics; NSSet is immutable, NSMutableSet is mutable."}]}, {"id": "t1-3", "title": "Protocols, categories and dynamic typing", "desc": "Understand extensibility and method contracts.", "code": "#import <Foundation/Foundation.h>\n@protocol Renderable <NSObject>\n- (NSString *)render;\n@optional\n- (void)refresh;\n@end\n@interface NSString (Preview)\n- (NSString *)preview;\n@end\n@implementation NSString (Preview)\n- (NSString *)preview { return [self uppercaseString]; }\n@end\nvoid show(id<Renderable> obj) {\n    if ([obj respondsToSelector:@selector(refresh)]) [obj refresh];\n    NSLog(@\"%@\", [obj render]);\n}", "concepts": [{"token": "@protocol Renderable", "name": "Protocols", "desc": "Declare method contracts independently of a superclass; classes may conform to multiple protocols."}, {"token": "@optional", "name": "Optional protocol methods", "desc": "Conforming classes need not implement optional methods; check availability before invoking them."}, {"token": "NSString (Preview)", "name": "Categories", "desc": "Add methods to an existing class without subclassing. Categories generally cannot add stored ivars; class extensions can declare private interface details."}, {"token": "[self uppercaseString]", "name": "Method dispatch and polymorphism", "desc": "The same selector can resolve to different implementations depending on the receiving object's runtime class."}, {"token": "id<Renderable>", "name": "Dynamic typing and conformance", "desc": "id represents an object of unspecified class; a protocol qualification adds compile-time interface information."}, {"token": "respondsToSelector:", "name": "Runtime availability checks", "desc": "Tests whether the receiver reports implementing a selector; isKindOfClass: tests class hierarchy membership."}, {"token": "@selector(refresh)", "name": "Selectors", "desc": "Creates a selector representing a method name, including colons for parameters; it is not a direct function pointer."}]}, {"id": "t1-4", "title": "ARC, lifetime and bridging", "desc": "Distinguish Objective-C ownership from C allocation.", "code": "#import <Foundation/Foundation.h>\n@interface Owner : NSObject\n@property (nonatomic, strong) NSObject *object;\n@property (nonatomic, weak) id delegate;\n@property (nonatomic, copy) NSString *name;\n@end\n@implementation Owner\n@end\nvoid demo(void) {\n    @autoreleasepool {\n        Owner *owner = [Owner new];\n        __weak Owner *weakOwner = owner;\n        CFStringRef ref = (__bridge CFStringRef)owner.name;\n        (void)ref; (void)weakOwner;\n    }\n}", "concepts": [{"token": "strong", "name": "Strong ownership", "desc": "ARC inserts ownership operations; strong references keep objects alive. Cyclic strong references can prevent deallocation."}, {"token": "weak", "name": "Weak references", "desc": "Does not keep the object alive and normally zeroes when the object deallocates. Good for many delegate relationships."}, {"token": "copy", "name": "Copy semantics", "desc": "Copies the value via the object's copy operation; common for strings and blocks. assign is suitable for scalar properties; unsafe_unretained does not zero itself."}, {"token": "@autoreleasepool", "name": "Autorelease pools", "desc": "Bounds lifetime of autoreleased objects, especially in loops or worker threads. Manual retain/release belongs to non-ARC code."}, {"token": "[Owner new]", "name": "Initialization and destruction", "desc": "new conventionally combines allocation and initialization; dealloc handles non-object resources under ARC. nil is a null object reference; messaging nil has special behavior."}, {"token": "__weak Owner *weakOwner", "name": "Object lifetime and retain cycles", "desc": "Weak capture/reference may break ownership cycles; use a strong local when consistent lifetime is required."}, {"token": "__bridge", "name": "Core Foundation bridging", "desc": "Changes pointer type without transferring ownership. __bridge_retained and __bridge_transfer have distinct ownership transfer rules; nullability annotations describe contracts."}]}, {"id": "t1-5", "title": "Blocks and dispatch queues", "desc": "Understand callbacks, captures and asynchronous work.", "code": "#import <Foundation/Foundation.h>\n#import <dispatch/dispatch.h>\nvoid run(void (^completion)(int)) {\n    __block int result = 0;\n    dispatch_queue_t q = dispatch_get_global_queue(QOS_CLASS_DEFAULT, 0);\n    dispatch_async(q, ^{\n        result = 42;\n        dispatch_async(dispatch_get_main_queue(), ^{\n            if (completion) completion(result);\n        });\n    });\n}", "concepts": [{"token": "void (^completion)(int)", "name": "Block declaration", "desc": "A block is a callable object that can capture its lexical context; this block takes int and returns void."}, {"token": "__block int result", "name": "Mutable capture", "desc": "__block allows a captured variable to be changed across block scopes. It is not a synchronization primitive."}, {"token": "dispatch_get_global_queue", "name": "Dispatch queues", "desc": "Global queues schedule work on system-managed threads. Custom queues may be serial or concurrent."}, {"token": "dispatch_async(q, ^{", "name": "Asynchronous execution", "desc": "Enqueues a block and returns before it finishes; the block captures variables according to their storage qualifiers."}, {"token": "dispatch_get_main_queue()", "name": "Main queue", "desc": "UI updates generally belong on the main queue. Blocking it reduces responsiveness."}, {"token": "completion(result)", "name": "Completion handlers", "desc": "A callback reports results after work completes; callers should know the queue and lifetime guarantees."}, {"token": "dispatch_async", "name": "Other dispatch primitives", "desc": "dispatch_sync waits for work and can deadlock on the same serial queue; dispatch_once initializes once, groups coordinate tasks, dispatch_after schedules delayed work."}]}, {"id": "t1-6", "title": "Runtime introspection", "desc": "Read selectors, class metadata and method representations.", "code": "#import <Foundation/Foundation.h>\n#import <objc/runtime.h>\nvoid describe(id obj) {\n    Class cls = object_getClass(obj);\n    SEL sel = @selector(description);\n    Method method = class_getInstanceMethod(cls, sel);\n    if (method) {\n        const char *types = method_getTypeEncoding(method);\n        IMP implementation = method_getImplementation(method);\n        NSLog(@\"%s %s\", class_getName(cls), types);\n        (void)implementation;\n    }\n}", "concepts": [{"token": "Class cls", "name": "Class metadata", "desc": "Class represents a runtime class object. object_getClass returns the actual class of an object; metaclasses represent class methods."}, {"token": "SEL sel", "name": "Selector and dispatch", "desc": "SEL identifies a method name; objc_msgSend dispatches based on receiver and selector with ABI-dependent argument rules."}, {"token": "Method method", "name": "Method introspection", "desc": "Runtime method metadata connects selectors, type encodings and implementation pointers."}, {"token": "method_getTypeEncoding", "name": "Type encodings", "desc": "Compact strings describe method return and parameter types; useful for understanding runtime interfaces."}, {"token": "IMP implementation", "name": "Method implementation pointer", "desc": "A callable implementation pointer; it has a receiver and selector in its ABI in addition to explicit arguments. Correct types matter."}, {"token": "class_getName", "name": "Runtime metadata and extensibility", "desc": "Ivar metadata describes instance variables; associated objects attach values; forwarding and dynamic resolution handle missing methods. Runtime replacement changes dispatch behavior and must be reasoned about carefully."}]}, {"id": "t1-7", "title": "Foundation services and UIKit", "desc": "Understand application lifecycle, views, callbacks and errors.", "code": "#import <UIKit/UIKit.h>\n@interface DemoController : UIViewController\n@end\n@implementation DemoController\n- (void)viewDidLoad {\n    [super viewDidLoad];\n    UILabel *label = [UILabel new];\n    label.text = NSLocalizedString(@\"Ready\", nil);\n    label.translatesAutoresizingMaskIntoConstraints = NO;\n    [self.view addSubview:label];\n    [NSLayoutConstraint activateConstraints:@[\n        [label.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],\n        [label.centerYAnchor constraintEqualToAnchor:self.view.centerYAnchor]\n    ]];\n}\n@end", "concepts": [{"token": "UIViewController", "name": "View controllers and lifecycle", "desc": "Coordinates a view hierarchy. Application delegates and scenes manage broader application lifecycle; viewDidLoad runs after a view is loaded."}, {"token": "UILabel *label", "name": "UIKit views", "desc": "Labels, buttons and table views are UI objects. Views are arranged hierarchically and updated on the main thread."}, {"token": "label.text", "name": "Dot notation", "desc": "Uses property accessors rather than directly accessing ivar storage; the setter may perform additional behavior."}, {"token": "NSLocalizedString", "name": "Localization", "desc": "Looks up user-facing strings in localized resources. Use explicit error messages and localized alerts where appropriate."}, {"token": "translatesAutoresizingMaskIntoConstraints", "name": "Auto Layout", "desc": "Disable generated constraints when specifying programmatic Auto Layout constraints for this view."}, {"token": "activateConstraints", "name": "Layout and UI composition", "desc": "Activates constraints that describe relationships. Navigation controllers manage stacks; target-action, delegates and animations coordinate interaction."}, {"token": "self.view", "name": "Foundation application services", "desc": "NSFileManager manages files; NSURL represents URLs; NSError conveys error details; NSUserDefaults stores preferences; NSNotificationCenter broadcasts notifications; NSDate represents time."}]}]}, {"id": "t2", "name": "C++", "short": "C++", "desc": "Native objects and resource ownership", "color": "#f1bd78", "lessons": [{"id": "t2-1", "title": "Basics, references and modern types", "desc": "Build on C while learning C++ syntax.", "code": "#include <cstdint>\nnamespace demo {\nusing Count = std::uint64_t;\nconstexpr int max_count = 8;\nenum class State { Idle, Ready };\nint add(int x, int y = 1) { return x + y; }\ndouble add(double x, double y) { return x + y; }\nvoid sample() {\n    int n = 3;\n    int &ref = n;\n    const int &read_only = n;\n    auto value = add(ref);\n    decltype(value) other = 0;\n    int *p = nullptr;\n}\n}", "concepts": [{"token": "namespace demo", "name": "Namespaces and scope", "desc": "Groups names to avoid collisions. Use demo::add to qualify a name outside the namespace."}, {"token": "using Count", "name": "Type aliases", "desc": "using creates an alias; it is the modern alternative to many typedef declarations."}, {"token": "constexpr int", "name": "Compile-time constants", "desc": "Can participate in constant expressions when conditions are met; constexpr functions can also be evaluated at runtime."}, {"token": "enum class State", "name": "Scoped enums", "desc": "Enumerator names are scoped to the enum and do not implicitly convert to integers like traditional unscoped enums."}, {"token": "int y = 1", "name": "Default arguments and overloading", "desc": "Omitted trailing arguments may use defaults; overload resolution chooses between functions by argument types and other rules."}, {"token": "int &ref", "name": "References", "desc": "A reference aliases an existing object; it cannot be reseated. const references can bind to temporaries and may extend lifetime in certain contexts."}, {"token": "auto value", "name": "Type deduction", "desc": "Compiler infers type from initialization; auto may drop reference and top-level const unless explicitly requested."}, {"token": "decltype(value)", "name": "Expression type inspection", "desc": "Produces a type based on the expression and its value category; parentheses can change the result."}, {"token": "nullptr", "name": "Null pointer literal", "desc": "Has its own type and converts to pointer types without ambiguity with ordinary integers."}]}, {"id": "t2-2", "title": "Classes, constructors and polymorphism", "desc": "Understand object-oriented native code and virtual dispatch.", "code": "class Shape {\nprotected:\n    int id;\npublic:\n    explicit Shape(int i) : id(i) {}\n    virtual ~Shape() = default;\n    virtual int area() const = 0;\n};\nclass Square final : public Shape {\n    int side;\npublic:\n    Square(int s) : Shape(1), side(s) {}\n    int area() const override { return this->side * side; }\n};\nint measure(const Shape &s) { return s.area(); }", "concepts": [{"token": "class Shape", "name": "Class and encapsulation", "desc": "Defines a type with fields and methods. class defaults to private access; struct defaults to public."}, {"token": "protected:", "name": "Access modifiers", "desc": "protected permits access from the class and derived classes; private limits access, public exposes the interface. friend can grant selected access."}, {"token": "explicit Shape(int i) : id(i)", "name": "Constructors and initializer lists", "desc": "Initializes members before the constructor body; explicit prevents unintended implicit conversion for this constructor."}, {"token": "virtual ~Shape()", "name": "Destructors and virtual cleanup", "desc": "Destroys resources; a virtual destructor permits correct destruction through a base pointer when polymorphic deletion is intended."}, {"token": "virtual int area() const = 0", "name": "Pure virtual and abstract classes", "desc": "Requires a concrete implementation before instantiation; const qualifies the method's access to object state."}, {"token": "class Square final : public Shape", "name": "Inheritance and final", "desc": "A derived class extends a base interface; final prevents further derivation. C++ also allows multiple inheritance, which affects object layout."}, {"token": "override", "name": "Method overriding", "desc": "Asks the compiler to verify that a virtual base method is overridden; overloads are a different concept."}, {"token": "this->side", "name": "Current object and member access", "desc": "this points to the current object. Member access is explicit here; private side remains encapsulated."}, {"token": "s.area()", "name": "Polymorphism and vtables", "desc": "Dynamic dispatch chooses the implementation for the actual object. Typical ABIs use vptr/vtables, but exact object layout is implementation-specific."}]}, {"id": "t2-3", "title": "RAII, smart pointers and move semantics", "desc": "Understand ownership and automatic resource cleanup.", "code": "#include <memory>\n#include <utility>\n#include <vector>\nstruct Item { int value; };\nvoid demo() {\n    auto owned = std::make_unique<Item>();\n    owned->value = 42;\n    auto moved = std::move(owned);\n    auto shared = std::make_shared<Item>();\n    std::weak_ptr<Item> weak = shared;\n    if (auto live = weak.lock()) { live->value = 7; }\n    std::vector<int> values{1,2,3};\n    auto copy = values;\n}", "concepts": [{"token": "std::make_unique", "name": "Unique ownership and RAII", "desc": "A unique_ptr owns one resource and releases it when destroyed; RAII ties resource lifetime to object lifetime, including exceptional exits."}, {"token": "owned->value", "name": "Object pointer access", "desc": "Smart pointers overload operator-> to expose the managed object; raw new/delete exist but should be paired correctly, including array forms."}, {"token": "std::move(owned)", "name": "Move semantics", "desc": "Casts to an rvalue category so move operations can transfer resources. A moved-from object remains valid but its state follows its type's contract."}, {"token": "std::make_shared", "name": "Shared ownership", "desc": "shared_ptr keeps a resource alive until the last owning reference is released; ownership cycles can leak."}, {"token": "std::weak_ptr", "name": "Weak ownership", "desc": "Observes a shared object without extending its lifetime; lock tries to acquire a temporary shared owner."}, {"token": "weak.lock()", "name": "Lifetime-safe access", "desc": "Tests whether the object still exists and holds ownership for the access; raw dangling pointers offer no such guarantee."}, {"token": "auto copy = values", "name": "Copy constructors and assignment", "desc": "Copies vector contents; user-defined types can customize copy/move construction and assignment. Prefer rule-of-zero designs where possible."}]}, {"id": "t2-4", "title": "Templates, containers and lambdas", "desc": "Read generic algorithms and typed collections.", "code": "#include <vector>\n#include <map>\n#include <algorithm>\n#include <string>\ntemplate<typename T>\nT larger(T a, T b) { return a < b ? b : a; }\nvoid demo() {\n    std::vector<int> data{3,1,2};\n    std::map<std::string,int> counts{{\"a\",1}};\n    int limit = 2;\n    auto pred = [limit](int n) { return n >= limit; };\n    std::sort(data.begin(), data.end());\n    auto it = std::find_if(data.begin(), data.end(), pred);\n    for (const auto &n : data) { (void)n; }\n}", "concepts": [{"token": "template<typename T>", "name": "Function and class templates", "desc": "Generate typed implementations from parameters. Instantiation checks whether the supplied type meets the operations used."}, {"token": "std::vector<int>", "name": "Dynamic arrays", "desc": "Stores contiguous elements and resizes; growth can invalidate pointers and iterators. std::array is fixed-size; std::list is node-based."}, {"token": "std::map<std::string,int>", "name": "Associative containers", "desc": "map orders keys; unordered_map hashes keys. set and unordered_set store unique keys; pair and tuple group values."}, {"token": "[limit](int n)", "name": "Lambda and capture", "desc": "Creates a callable object capturing limit by value. [&limit] captures by reference and requires the referred object to remain alive."}, {"token": "std::sort", "name": "Algorithms", "desc": "Operates on iterator ranges; ordering predicates must meet algorithm requirements."}, {"token": "data.begin(), data.end()", "name": "Iterators", "desc": "Represent positions; end is one past the last element and cannot be dereferenced. Invalidation rules depend on container operations."}, {"token": "std::find_if", "name": "Searching", "desc": "Returns an iterator to a matching element or end. Check the result before dereference; std::optional is another way to represent absence."}, {"token": "for (const auto &n : data)", "name": "Range-based loop", "desc": "Uses range iteration; const reference avoids copying and prevents direct element modification."}]}, {"id": "t2-5", "title": "Casting, exceptions, ABI and concurrency", "desc": "Understand native boundaries and advanced runtime features.", "code": "#include <stdexcept>\n#include <mutex>\n#include <atomic>\nstruct Base { virtual ~Base() = default; };\nstruct Child : Base {};\nextern \"C\" int native_entry(int value);\nint check(Base *b) {\n    if (auto *c = dynamic_cast<Child *>(b)) return 1;\n    try { throw std::runtime_error(\"type mismatch\"); }\n    catch (const std::exception &) { return 0; }\n}\nstd::mutex lock;\nstd::atomic<int> counter{0};\nvoid update() { std::lock_guard<std::mutex> guard(lock); ++counter; }", "concepts": [{"token": "virtual ~Base()", "name": "RTTI and polymorphic types", "desc": "Virtual functions make a type polymorphic; runtime type information supports dynamic_cast and typeid where enabled."}, {"token": "dynamic_cast<Child *>(b)", "name": "Checked runtime cast", "desc": "Returns null for a failed pointer downcast. static_cast performs compile-time-checked conversions without equivalent runtime validation."}, {"token": "extern \"C\"", "name": "C linkage and name mangling", "desc": "Declares a C-compatible linkage name for interoperability; C++ overloads usually have mangled symbols."}, {"token": "throw std::runtime_error", "name": "Exceptions", "desc": "Transfers control to a matching handler and unwinds automatic objects. Some low-level builds disable exceptions; follow build policy."}, {"token": "catch (const std::exception &)", "name": "Exception handling", "desc": "Catches by reference to avoid slicing; try encloses code that can throw."}, {"token": "std::lock_guard", "name": "RAII synchronization", "desc": "Acquires and releases a mutex across scope. std::thread, condition_variable and atomic support concurrent work."}, {"token": "std::atomic<int>", "name": "Atomic operations", "desc": "Provides atomic access and memory ordering; it is not a substitute for protecting compound invariants."}, {"token": "struct Child : Base", "name": "Object layout and casts", "desc": "reinterpret_cast changes low-level interpretation without guaranteeing valid access; const_cast changes qualifiers but modifying an originally const object is undefined. Placement new constructs in existing aligned storage; lvalue/rvalue categories affect lifetime."}]}, {"id": "t2-6", "title": "IOKit and C++ systems patterns", "desc": "Connect native object concepts to the kernel architecture at a conceptual level.", "code": "class Service {\npublic:\n    virtual bool start() = 0;\n    virtual void stop() = 0;\n    virtual ~Service() = default;\n};\nclass DemoService : public Service {\n    bool running = false;\npublic:\n    bool start() override { running = true; return running; }\n    void stop() override { running = false; }\n};", "concepts": [{"token": "class Service", "name": "Service abstraction", "desc": "A simplified teaching interface models lifecycle operations. Actual XNU IOKit uses its own classes and conventions, not this example."}, {"token": "virtual bool start()", "name": "Driver lifecycle", "desc": "Frameworks often expose initialization/start/stop operations; callers must respect lifecycle and ownership contracts."}, {"token": "bool running = false", "name": "State and invariants", "desc": "An object's fields represent state; methods should preserve invariants even when operations fail or concurrency is involved."}, {"token": "class DemoService : public Service", "name": "IOKit architecture", "desc": "IOKit organizes services, matching and driver relationships. OSObject-derived classes use framework-specific reference counting rather than assuming STL ownership."}, {"token": "void stop() override", "name": "Resource teardown", "desc": "Stop operations should release resources, stop asynchronous work and respect callbacks' lifetime. Real kernel code has stricter allocation and blocking constraints."}]}]}, {"id": "t3", "name": "Objective-C++", "short": "ObjC++", "desc": "Mixed-language native integration", "color": "#e8a9f7", "lessons": [{"id": "t3-1", "title": "Mixed translation units", "desc": "Combine Objective-C objects with C++ containers in a .mm file.", "code": "#import <Foundation/Foundation.h>\n#include <vector>\n#include <string>\n@interface Summary : NSObject\n- (NSString *)render;\n@end\n@implementation Summary {\n    std::vector<int> _values;\n}\n- (NSString *)render {\n    _values.push_back(42);\n    std::string text = std::to_string(_values.front());\n    return [NSString stringWithUTF8String:text.c_str()];\n}\n@end", "concepts": [{"token": "#import <Foundation/Foundation.h>", "name": "Mixed-language compilation", "desc": "A .mm file is compiled as Objective-C++; Objective-C and C++ constructs may coexist. A .m file is normally Objective-C only."}, {"token": "#include <vector>", "name": "Header interoperability", "desc": "C++ standard headers require C++ compilation; use conditional __cplusplus guards when exposing shared headers to C."}, {"token": "std::vector<int> _values", "name": "C++ members in Objective-C classes", "desc": "A native C++ object can be stored in an Objective-C instance in ObjC++; constructors/destructors follow compiler-managed lifetime rules."}, {"token": "_values.push_back", "name": "Calling C++ methods", "desc": "Use ordinary C++ member syntax and templates inside Objective-C method implementations."}, {"token": "std::to_string", "name": "Type conversion", "desc": "Converts a number to a C++ string. Foundation and STL strings are separate types with different ownership and encoding conventions."}, {"token": "text.c_str()", "name": "Borrowed pointer lifetime", "desc": "Provides a NUL-terminated pointer into the string, valid only while the string remains alive and not invalidated."}, {"token": "[NSString stringWithUTF8String:text.c_str()]", "name": "Bridging data", "desc": "Creates an NSString from UTF-8 C text; encoding validity and embedded NUL bytes matter. C++ std::string can contain NUL bytes."}]}, {"id": "t3-2", "title": "ARC and RAII at the boundary", "desc": "Manage objects and native resources together safely.", "code": "#import <Foundation/Foundation.h>\n#include <memory>\nstruct Record { int value = 0; };\n@interface Store : NSObject\n- (NSNumber *)number;\n@end\n@implementation Store {\n    std::unique_ptr<Record> _record;\n}\n- (instancetype)init {\n    self = [super init];\n    if (self) _record = std::make_unique<Record>();\n    return self;\n}\n- (NSNumber *)number { return @(_record->value); }\n@end", "concepts": [{"token": "std::unique_ptr<Record>", "name": "RAII and ARC", "desc": "RAII manages native resources while ARC manages Objective-C references. They are different ownership systems and may coexist."}, {"token": "[super init]", "name": "Initialization order", "desc": "Initialize the Objective-C superclass before using self; initialize native members according to their C++ construction semantics."}, {"token": "std::make_unique<Record>()", "name": "Native resource ownership", "desc": "Creates uniquely owned C++ storage. Do not independently free the same resource through C APIs."}, {"token": "@(_record->value)", "name": "Scalar boxing", "desc": "Reads a C++ member and boxes it into NSNumber using Objective-C literal syntax."}, {"token": "@implementation Store", "name": "Lifetime across callbacks", "desc": "Do not capture borrowed C++ references or raw Objective-C pointers beyond their lifetime; choose ownership deliberately. Exceptions crossing language boundaries need explicit policy."}]}, {"id": "t3-3", "title": "C-compatible API boundaries", "desc": "Expose stable interfaces to other languages and understand linkage.", "code": "#ifdef __cplusplus\nextern \"C\" {\n#endif\nint sample_count(const char *name, unsigned long length);\n#ifdef __cplusplus\n}\n#endif", "concepts": [{"token": "#ifdef __cplusplus", "name": "Conditional headers", "desc": "The macro is defined when compiling C++; guards allow a header to be included from both C and C++."}, {"token": "extern \"C\"", "name": "C language linkage", "desc": "Requests C linkage for the declaration when compiled as C++; useful for stable exported function names and mixed-language consumers."}, {"token": "const char *name", "name": "ABI-compatible types", "desc": "Prefer documented plain scalar types, pointers and opaque handles at a C boundary; avoid exposing C++ containers directly."}, {"token": "unsigned long length", "name": "Size and ABI contracts", "desc": "Widths may depend on the ABI; specify whether a length is bytes or elements and whether ownership is transferred."}, {"token": "int sample_count", "name": "Boundary error handling", "desc": "Define return/error conventions and validate data before conversion. Do not let C++ exceptions propagate across C APIs; document thread safety."}]}]}, {"id": "t4", "name": "ARM64", "short": "A64", "desc": "AArch64 machine-level programming", "color": "#ff9e91", "lessons": [{"id": "t4-1", "title": "Registers, data movement and immediates", "desc": "Learn the basic CPU execution model.", "code": ".text\n.global _example\n_example:\n    mov w0, #42\n    mov x1, x0\n    movz x2, #0x1234\n    movk x2, #0x5678, lsl #16\n    add x0, x1, xzr\n    ret", "concepts": [{"token": ".text", "name": "Assembler directives", "desc": "Selects the code section; .data selects data, .align controls alignment (assembler-specific semantics), .global exports a symbol."}, {"token": "_example:", "name": "Labels and symbols", "desc": "Names an instruction address; the linker may resolve references to symbols. Apple Mach-O conventionally prefixes C external names with underscore."}, {"token": "mov w0, #42", "name": "W and X register views", "desc": "w0 is the low 32-bit view of x0; writing a W register zeroes the upper 32 bits. X0–X30 are general-purpose registers."}, {"token": "mov x1, x0", "name": "Register operands", "desc": "Copies a register value. mov may be an assembler alias for another instruction."}, {"token": "movz", "name": "Immediate construction", "desc": "MOVZ inserts a 16-bit immediate and zeros remaining bits; MOVK updates a selected 16-bit portion, MOVN uses an inverted immediate."}, {"token": "xzr", "name": "Zero register", "desc": "Reads as zero and discards writes. Some instruction encodings instead interpret register 31 as SP; context matters."}, {"token": "ret", "name": "Program counter and link register", "desc": "RET normally branches to X30, the link register. PC denotes the current instruction address conceptually; it is not a normal general-purpose register."}]}, {"id": "t4-2", "title": "Arithmetic, flags and bit operations", "desc": "Translate integer expressions into machine instructions.", "code": "    add w0, w0, #5\n    subs w1, w0, #3\n    mul w2, w0, w1\n    udiv w3, w2, w1\n    and w4, w0, #0xff\n    orr w5, w4, #0x100\n    eor w6, w5, w4\n    lsl w7, w6, #1\n    lsr w7, w7, #1\n    cmp w0, #10", "concepts": [{"token": "add w0, w0, #5", "name": "Addition and subtraction", "desc": "ADD and SUB operate on register-width values; ADDS/SUBS also update condition flags."}, {"token": "subs", "name": "NZCV flags", "desc": "N reflects sign, Z zero, C carry or no borrow, V signed overflow. Flags are used by conditional instructions."}, {"token": "mul", "name": "Multiplication", "desc": "MUL computes the low-width product; MADD multiplies and adds. Width and signedness matter for widening operations."}, {"token": "udiv", "name": "Division", "desc": "UDIV interprets unsigned inputs; SDIV interprets signed inputs. CPU behavior is not identical to C's undefined divide-by-zero semantics."}, {"token": "and", "name": "Bitwise AND", "desc": "Masks bits; ORR sets bits, EOR toggles differences and BIC clears selected bits."}, {"token": "orr", "name": "Logical operations", "desc": "ORR merges bits; EOR is exclusive OR, BIC applies AND with a complemented operand."}, {"token": "lsl", "name": "Shifts", "desc": "LSL shifts left, LSR shifts right with zero-fill, ASR shifts right with sign replication."}, {"token": "cmp", "name": "Comparison", "desc": "CMP is an alias of flag-setting subtraction with the result discarded; CMN uses addition, TST uses bitwise AND."}]}, {"id": "t4-3", "title": "Loads, stores and addressing", "desc": "Read how native code accesses ordinary memory.", "code": "    ldr w1, [x0]\n    ldrb w2, [x0, #4]\n    ldrh w3, [x0, #6]\n    str w1, [x0, #8]\n    ldr x4, [x0, #16]!\n    str x4, [x0], #8\n    ldp x5, x6, [x0]\n    stp x5, x6, [x0, #16]", "concepts": [{"token": "ldr w1, [x0]", "name": "Register-indirect load", "desc": "Reads four bytes at the address in x0 into w1. LDR with an X destination loads eight bytes; access requires valid mapped storage."}, {"token": "ldrb", "name": "Byte load", "desc": "Reads one byte and zero-extends it; LDRH loads a halfword. Signed load variants sign-extend."}, {"token": "[x0, #6]", "name": "Base plus offset", "desc": "Computes an effective address from a base register and immediate offset without changing the base for this form."}, {"token": "str w1", "name": "Store", "desc": "Writes the register's low 32 bits into memory. STRB and STRH store smaller widths."}, {"token": "[x0, #16]!", "name": "Pre-indexed addressing", "desc": "Updates x0 by the offset before the access; the exclamation mark marks write-back."}, {"token": "[x0], #8", "name": "Post-indexed addressing", "desc": "Accesses the original address then updates x0 by eight bytes."}, {"token": "ldp", "name": "Paired operations", "desc": "LDP loads two registers from consecutive locations; STP stores two. They are common in stack frames."}, {"token": "stp", "name": "Memory representation", "desc": "Little-endian stores the least significant byte at the lowest address. Alignment and permissions affect whether accesses succeed."}]}, {"id": "t4-4", "title": "Branches, conditions and loops", "desc": "Follow machine-level control flow.", "code": "    mov w1, #0\nloop:\n    cmp w1, w0\n    b.ge done\n    add w1, w1, #1\n    cbz w0, done\n    tbz w1, #0, even\n    b loop\neven:\n    b loop\ndone:\n    csel w0, w1, wzr, ge\n    ret", "concepts": [{"token": "loop:", "name": "Control flow labels", "desc": "A branch can target a label. A loop is a branch structure, not a special machine-level loop syntax here."}, {"token": "cmp w1, w0", "name": "Condition flags", "desc": "Sets flags based on subtraction; following conditional branches interpret them according to signed or unsigned conditions."}, {"token": "b.ge", "name": "Conditional branch", "desc": "Branches when signed greater-or-equal condition is satisfied. B.EQ/B.NE test equality; unsigned comparisons use other condition codes."}, {"token": "cbz", "name": "Compare and branch", "desc": "CBZ branches if a register is zero; CBNZ if nonzero. These instructions do not update NZCV."}, {"token": "tbz", "name": "Test bit and branch", "desc": "TBZ tests one bit for zero; TBNZ tests for nonzero. Bit numbers must fit the register width."}, {"token": "b loop", "name": "Unconditional branch", "desc": "Transfers control to a label. BR branches indirectly to an address in a register."}, {"token": "csel", "name": "Conditional select", "desc": "Chooses one of two register values according to existing flags without branching."}]}, {"id": "t4-5", "title": "Calling convention and stack frames", "desc": "Understand how compiled functions pass arguments and save state.", "code": "_example:\n    stp x29, x30, [sp, #-16]!\n    mov x29, sp\n    add w0, w0, #5\n    bl _helper\n    ldp x29, x30, [sp], #16\n    ret\n_helper:\n    add w0, w0, #1\n    ret", "concepts": [{"token": "stp x29, x30", "name": "Function prologue", "desc": "Saves the old frame pointer and return address on the stack. Actual prologues vary with compiler options and ABI."}, {"token": "[sp, #-16]!", "name": "Stack pointer and alignment", "desc": "Allocates 16 bytes by moving SP downward; AArch64 calling boundaries require stack alignment under the ABI."}, {"token": "mov x29, sp", "name": "Frame pointer", "desc": "Establishes a frame reference. X29 is conventional frame pointer, although optimized code may omit it where allowed."}, {"token": "add w0, w0, #5", "name": "Arguments and results", "desc": "X0–X7 commonly carry integer arguments; X0 often returns a scalar. V0–V31 are SIMD registers, with V0–V7 commonly used for floating-point arguments."}, {"token": "bl _helper", "name": "Branch with link", "desc": "Calls helper and writes return address to X30. BLR calls via a register. Caller-saved registers may be overwritten."}, {"token": "ldp x29, x30", "name": "Epilogue and preserved registers", "desc": "Restores saved state. X19–X28 are generally callee-saved; Apple reserves X18 for platform use. Rules for SIMD registers differ."}, {"token": "ret", "name": "Return and ABI", "desc": "Transfers control to saved link address. ABI also defines stack arguments, return layouts and aggregate passing."}]}, {"id": "t4-6", "title": "Address generation and inline assembly", "desc": "Connect symbols and compiler-generated code without privileged operations.", "code": "    adrp x0, _message@PAGE\n    add x0, x0, _message@PAGEOFF\n
